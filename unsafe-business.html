<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNSAFE Business Inc. — A Cybersecurity Investigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Space+Mono:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --wall:#E4D9BE;
    --wall-dark:#D3C6A2;
    --tile-a:#C9BFA0;
    --tile-b:#AFA37F;
    --teal:#2F6B67;
    --teal-dark:#1B4643;
    --burgundy:#8B3A4A;
    --burgundy-dark:#642A35;
    --mustard:#D9A441;
    --mustard-dark:#B4832C;
    --navy:#232336;
    --paper:#F4EEDD;
    --crt-green:#39FF6E;
    --crt-amber:#FFB000;
    --ink:#232336;
    --danger:#B23B3B;
    --good:#3F7A4D;
    font-family:'Space Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--navy);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  #app{
    position:relative;
    width:100%;
    min-height:100vh;
    background:
      linear-gradient(rgba(35, 35, 54, 0.65), rgba(35, 35, 54, 0.85)),
      url('./bg.png') center/cover no-repeat fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .stage{
    width:100%;
    max-width:960px;
    position:relative;
  }
  h1,h2,h3{font-family:'Alfa Slab One',serif; margin:0; letter-spacing:0.5px;}
  .badge{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:4px 10px;
    border:2px solid currentColor;
    border-radius:2px;
  }

  /* ---------- SCANLINE / CRT FRAME (signature element) ---------- */
  .crt-frame{
    position:relative;
    background:#0d1410;
    border-radius:10px;
    padding:3px;
    box-shadow:0 0 0 3px #111, 0 18px 40px rgba(0,0,0,0.55), inset 0 0 30px rgba(0,0,0,0.8);
  }
  .crt-inner{
    position:relative;
    border-radius:7px;
    overflow:hidden;
    background:var(--paper);
  }
  .crt-inner::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.06) 0px,
      rgba(0,0,0,0.06) 1px,
      transparent 2px,
      transparent 3px
    );
    pointer-events:none;
    mix-blend-mode:multiply;
    z-index:5;
  }
  .crt-inner::after{
    content:"";
    position:absolute; inset:0;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.35);
    pointer-events:none;
    z-index:6;
  }
  .rec-tag{
    position:absolute; top:10px; right:14px; z-index:8;
    font-size:11px; font-weight:700; color:#ff4d4d;
    display:flex; align-items:center; gap:6px;
    text-shadow:0 0 6px rgba(255,0,0,0.6);
    letter-spacing:1px;
  }
  .rec-dot{
    width:8px;height:8px;border-radius:50%;background:#ff4d4d;
    animation:blink 1s infinite;
  }
  @keyframes blink{ 50%{opacity:0.15;} }
  .timestamp{
    position:absolute; bottom:10px; left:14px; z-index:8;
    font-size:10px; color:rgba(35,35,54,0.55); letter-spacing:1px;
  }

  /* ---------- TITLE SCREEN ---------- */
  .title-screen{ text-align:center; padding:48px 28px 40px; }
  .marquee{
    background:var(--burgundy);
    color:var(--paper);
    padding:22px 16px 18px;
    border-bottom:6px solid var(--mustard);
    margin:-3px -3px 0 -3px;
    border-radius:7px 7px 0 0;
  }
  .marquee h1{ font-size:clamp(28px,5vw,46px); color:var(--paper); text-shadow:3px 3px 0 var(--burgundy-dark);}
  .marquee .sub{ font-family:'Space Mono',monospace; font-size:13px; letter-spacing:3px; margin-top:8px; opacity:0.9;}
  .building-icon{ font-size:64px; margin:18px 0 6px; }
  .title-copy{ max-width:560px; margin:0 auto; line-height:1.6; font-size:14px; color:#3a3a2e;}
  .role-card{
    display:inline-block;
    background:var(--wall);
    border:2px dashed var(--teal-dark);
    padding:12px 18px;
    margin:18px 0;
    font-size:13px;
    text-align:left;
    max-width:480px;
  }
  .role-card b{color:var(--teal-dark);}
  .btn{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:13px 26px;
    border:3px solid var(--ink);
    border-radius:4px;
    cursor:pointer;
    background:var(--mustard);
    color:var(--navy);
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .08s ease;
  }
  .btn:hover{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
  .btn:active{ transform:translate(4px,4px); box-shadow:0 0 0 var(--ink); }
  .btn.secondary{ background:var(--paper); }
  .btn.good{ background:var(--good); color:var(--paper); }
  .btn.small{ padding:8px 14px; font-size:11px; box-shadow:3px 3px 0 var(--ink);}
  .btn:disabled{opacity:0.4; cursor:not-allowed; box-shadow:2px 2px 0 var(--ink);}

  /* ---------- LOBBY / ELEVATOR ---------- */
  .lobby{ padding:22px; }
  .lobby-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .directory{
    background:var(--paper);
    border:2px solid var(--ink);
    padding:10px 14px;
    font-size:11px;
    margin-bottom:16px;
  }
  .floor-list{ display:flex; flex-direction:column; gap:10px; }
  .floor-btn{
    display:flex; align-items:center; gap:14px;
    background:var(--wall);
    border:2px solid var(--ink);
    border-left:10px solid var(--teal);
    padding:12px 14px;
    cursor:pointer;
    text-align:left;
    font-family:'Space Mono',monospace;
  }
  .floor-btn.locked{ opacity:0.45; cursor:not-allowed; border-left-color:#999; }
  .floor-btn.cleared{ border-left-color:var(--good); background:#e9f0e4; }
  .floor-num{
    font-family:'Alfa Slab One',serif;
    font-size:26px;
    color:var(--teal-dark);
    width:44px; text-align:center; flex-shrink:0;
  }
  .floor-btn.cleared .floor-num{ color:var(--good); }
  .floor-info{ flex:1; }
  .floor-info .fname{ font-weight:700; font-size:14px; }
  .floor-info .ftag{ font-size:11px; color:#555; }
  .floor-status{ font-size:11px; font-weight:700; letter-spacing:1px; white-space:nowrap;}
  .status-locked{ color:#888; }
  .status-open{ color:var(--burgundy);}
  .status-clear{ color:var(--good);}

  /* ---------- FLOOR SCENE ---------- */
  .floor-scene{ position:relative; }
  .scene-header{
    background:var(--teal-dark);
    color:var(--paper);
    padding:12px 16px;
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:8px;
    border-bottom:5px solid var(--mustard);
  }
  .scene-header h2{ font-size:18px; color:var(--paper); }
  .scene-header .ftag{ font-size:11px; opacity:0.85;}
  .progress-pill{
    background:rgba(0,0,0,0.25);
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
  }
  .room{
    position:relative;
    height:420px;
    background:#222;
    overflow:hidden;
  }
  .wall-strip{ display:none; }
  .furniture{ position:absolute; }
  .desk{ width:150px; height:60px; background:#7a5a3a; border-radius:3px; box-shadow:0 6px 0 #543c26; }
  .monitor{ width:70px; height:52px; background:#3a3a3a; border-radius:4px; padding:5px; }
  .monitor-screen{ width:100%; height:100%; background:#0f2e17; border-radius:2px; box-shadow:inset 0 0 8px var(--crt-green); }
  .cabinet{ width:60px; height:110px; background:#7a8a86; border-radius:2px; box-shadow:0 6px 0 #566862;}
  .cabinet .drawer{ height:24%; margin:4px 6px; background:#5f716c; border-radius:1px;}
  .plant-pot{ width:36px; height:30px; background:#a65d3a; border-radius:0 0 8px 8px; }
  .plant-leaf{ width:44px; height:44px; background:#4c7a4a; border-radius:60% 40% 50% 50%; position:absolute; top:-34px; left:-4px; }
  .cooler{ width:34px; height:90px; background:#dfeaf0; border:2px solid #9fb6bd; border-radius:4px;}
  .cooler-jug{ width:26px; height:30px; background:#7fbfe0aa; border-radius:0 0 12px 12px; margin:2px auto; }
  .door{ width:56px; height:120px; background:#8a6a45; border:3px solid #5c4429; }
  .rug{ width:220px; height:60px; background:var(--burgundy); opacity:0.35; border-radius:6px;}

  .person { position:absolute; width:40px; height:80px; z-index:3; }
  .person-head { width:26px; height:26px; background:#e8b5a2; border-radius:50%; position:absolute; top:0; left:7px; border:2px solid var(--ink);}
  .person-body { width:34px; height:40px; background:var(--burgundy); border-radius:8px 8px 0 0; position:absolute; top:28px; left:3px; border:2px solid var(--ink);}
  .person-legs { width:10px; height:14px; background:var(--navy); position:absolute; top:66px; left:8px; border:2px solid var(--ink); box-shadow: 12px 0 0 var(--navy), 12px 0 0 2px var(--ink);}
  .person.alt-1 .person-body { background:var(--teal); }
  .person.alt-2 .person-body { background:var(--mustard); }
  .person.alt-2 .person-head { background:#c29074; }
  .hotspot{
    position:absolute;
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
    background:var(--mustard);
    border:3px solid var(--ink);
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 0 0 0 rgba(217,164,65,0.6);
    animation:pulse 1.8s infinite;
    z-index:4;
  }
  .hotspot:hover{ transform:scale(1.08); }
  .hotspot.resolved{
    background:var(--good);
    animation:none;
    cursor:default;
    opacity:0.85;
  }
  .hotspot .check{ display:none; }
  .hotspot.resolved .icon{ display:none; }
  .hotspot.resolved .check{ display:block; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(217,164,65,0.55);}
    70%{ box-shadow:0 0 0 14px rgba(217,164,65,0);}
    100%{ box-shadow:0 0 0 0 rgba(217,164,65,0);}
  }

  .scene-footer{
    background:var(--paper);
    padding:10px 16px;
    display:flex; justify-content:space-between; align-items:center;
    border-top:2px solid var(--ink);
    flex-wrap:wrap; gap:8px;
  }
  .hint{ font-size:11px; color:#555; }

  /* ---------- MODAL / CONFESSION CAM ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,10,16,0.72);
    display:flex; align-items:center; justify-content:center;
    z-index:50; padding:18px;
  }
  .modal{
    width:100%; max-width:520px;
  }
  .modal-body{ padding:18px 18px 20px; }
  .char-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .avatar{
    width:52px; height:52px; border-radius:50%;
    background:var(--teal); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; border:3px solid var(--ink); flex-shrink:0;
  }
  .char-name{ font-weight:700; font-size:14px; }
  .char-role{ font-size:11px; color:#666; }
  .dialogue{
    background:#fff; border:2px solid var(--ink); border-radius:6px;
    padding:12px; font-size:13px; line-height:1.55; margin-bottom:14px;
    position:relative;
  }
  .issue-title{
    font-family:'Alfa Slab One',serif; font-size:15px; color:var(--burgundy);
    margin-bottom:8px;
  }
  .choices{ display:flex; flex-direction:column; gap:8px; }
  .choice-btn{
    text-align:left;
    font-family:'Space Mono',monospace;
    font-size:12.5px;
    padding:10px 12px;
    background:var(--wall);
    border:2px solid var(--ink);
    border-radius:4px;
    cursor:pointer;
  }
  .choice-btn:hover{ background:var(--mustard); }
  .feedback{
    margin-top:10px; padding:10px 12px; border-radius:4px; font-size:12.5px; line-height:1.5;
    border:2px solid var(--ink);
  }
  .feedback.correct{ background:#e6f2e2; color:var(--good); }
  .feedback.wrong{ background:#f6e3e0; color:var(--danger); }
  .modal-actions{ margin-top:12px; text-align:right; }

  .sticky{
    font-family:'Caveat',cursive;
    background:#fff6a8;
    display:inline-block;
    padding:2px 6px;
    transform:rotate(-2deg);
    border:1px solid #d8cf6a;
  }

  /* ---------- ENDING ---------- */
  .ending{ text-align:center; padding:40px 24px; }
  .certificate{
    background:var(--paper);
    border:6px double var(--burgundy);
    padding:26px 20px;
    margin:20px auto;
    max-width:480px;
  }
  .certificate h2{ color:var(--burgundy); font-size:22px; margin-bottom:6px;}
  .certificate .line{ margin:14px 0; font-size:13px; }
  .recap{ text-align:left; max-width:520px; margin:18px auto 0; font-size:12px; }
  .recap ul{ padding-left:18px; line-height:1.7; }

  .footer-note{ text-align:center; color:#8a8aa0; font-size:11px; margin-top:14px; }

  @media (max-width:560px){
    .room{ height:360px; }
    .marquee h1{ font-size:26px; }
  }
  
  /* Registration Options Styling */
  .reg-options {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .reg-tab {
    flex: 1;
    padding: 8px;
    background: var(--wall);
    border: 2px solid var(--ink);
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    font-size: 11px;
    transition: all 0.15s ease;
  }
  .reg-tab.active {
    background: var(--mustard);
    box-shadow: 2px 2px 0 var(--ink);
    transform: translate(-1px, -1px);
  }
  .reg-panel {
    display: none;
  }
  .reg-panel.active {
    display: block;
  }
  .select-input {
    width: 100%;
    padding: 10px;
    margin-bottom: 16px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    font-family: 'Space Mono';
    font-size: 14px;
    background: #fff;
  }
</style>
</head>
<body>
<div id="app">
  <img src="Icon - Red.png" alt="Logo" style="position:fixed; top:20px; left:20px; width:60px; height:auto; z-index:100; drop-shadow: 0 4px 10px rgba(0,0,0,0.5);">
  <div class="stage" id="stage"></div>
</div>

<script>
/* ============ GAME DATA ============ */
const FLOORS = [
  {
    id:1, name:"Reception", tag:"Floor 1 — Threshold of Trust",
    accent:"teal",
    hotspots:[
      {
        id:"f1a", x:"18%", y:"46%", icon:"",
        title:"The Password on Display",
        char:"Debbie", role:"Front Desk", avatar:"ID",
        dialogue:"Debbie beams at the camera. \"Oh, that? That's just my password so I don't forget it! Anyone who needs the Wi-Fi just... looks at the monitor.\"",
        choices:[
          {text:"Remove the sticky note, shred it, and set Debbie up with a password manager.", correct:true,
           feedback:"Correct. Written passwords in plain sight can be read (or photographed) by any visitor. A password manager keeps strong, unique passwords without the sticky notes."},
          {text:"Turn the sticky note face-down so it's more discreet.", correct:false,
           feedback:"Not quite — it's still there for anyone who flips it over, including the next visitor who 'just needs to check something.'"},
          {text:"Leave it — everyone in the office already knows it anyway.", correct:false,
           feedback:"That's exactly the problem — 'everyone knows it' includes visitors, delivery drivers, and anyone glancing at the desk."}
        ]
      },
      {
        id:"f1b", x:"55%", y:"40%", icon:"",
        title:"The Unattended Screen",
        char:"Debbie", role:"Front Desk", avatar:"ID",
        dialogue:"Debbie steps away for coffee. Her screen sits wide open — email, the visitor log, everything — for anyone walking past the desk.",
        choices:[
          {text:"Lock the screen (Win+L / ⌘+Ctrl+Q) every time you step away, even for a minute.", correct:true,
           feedback:"Correct. An unlocked, unattended computer is an open door — literally, at a front desk. Locking it takes two seconds and closes that gap."},
          {text:"It's fine, she's only gone for a minute.", correct:false,
           feedback:"A minute is plenty of time to plug in a USB drive or copy a file. 'Just a minute' is how most walk-by incidents happen."},
          {text:"Angle the monitor so it's harder to see from the lobby.", correct:false,
           feedback:"Better sightlines help, but the screen is still unlocked and usable by anyone who reaches the keyboard."}
        ]
      },
      {
        id:"f1c", x:"84%", y:"50%", icon:"",
        title:"The Friendly Tailgater",
        char:"Marcus", role:"Delivery Guest", avatar:"ID",
        dialogue:"A man in a delivery vest smiles and slips through the badge door right behind an employee. \"Don't worry, I'm quick — I know where I'm going!\"",
        choices:[
          {text:"Stop him at the door, verify who he's visiting, and sign him in as a guest.", correct:true,
           feedback:"Correct. This is 'tailgating' — following an authorized person through a secure door. Every visitor should be verified and signed in, no exceptions for a friendly face."},
          {text:"Hold the door open for him — he seems nice.", correct:false,
           feedback:"Being nice is how tailgating works. Badge doors only protect the building if only badge-holders (and verified guests) go through them."},
          {text:"Ignore it, he's probably fine.", correct:false,
           feedback:"'Probably fine' isn't a security policy. Unverified people inside the building can access desks, screens, and paperwork."}
        ]
      }
    ]
  },
  {
    id:2, name:"Sales Department", tag:"Floor 2 — The Click Heard Round the Office",
    accent:"burgundy",
    hotspots:[
      {
        id:"f2a", x:"20%", y:"38%", icon:"",
        title:"The Urgent Package Email",
        char:"Gary", role:"Account Executive", avatar:"ID",
        dialogue:"Gary's cursor hovers over a subject line: \"URGENT: Your package is delayed — click to reschedule.\" \"I don't even remember ordering anything, but it says urgent!\"",
        choices:[
          {text:"Hover over the link to check the real address, then report it as phishing instead of clicking.", correct:true,
           feedback:"Correct. Urgency plus an unexpected link is a classic phishing pattern. Checking the real link and reporting it stops the trap before it opens."},
          {text:"Click it — better safe than sorry about a missed package.", correct:false,
           feedback:"That's exactly the panic phishing emails are designed to create. Clicking can install malware or steal login credentials."},
          {text:"Forward it to a coworker to ask if it's real.", correct:false,
           feedback:"Better than clicking, but it still spreads the risky link around and delays reporting it. Report to IT/security directly instead."}
        ]
      },
      {
        id:"f2b", x:"52%", y:"44%", icon:"",
        title:"The Mystery USB Drive",
        char:"Priya", role:"Sales Rep", avatar:"ID",
        dialogue:"Priya found a USB drive in the parking lot labeled \"Bonus Payroll List 2026.\" \"I mean... it basically has my name on it, right?\"",
        choices:[
          {text:"Don't plug it in — hand it to IT so they can check it safely.", correct:true,
           feedback:"Correct. Unknown USB drives are a well-known way to deliver malware. A tempting label ('Bonus', 'Confidential') is the bait, not a reason to trust it."},
          {text:"Plug it in just to peek at the filenames.", correct:false,
           feedback:"Even opening it can trigger malicious code automatically. 'Just a peek' is all it takes."},
          {text:"Leave it on your desk for now and deal with it later.", correct:false,
           feedback:"An unknown device sitting around is still a risk — and easy to forget about. Hand it to IT right away."}
        ]
      },
      {
        id:"f2c", x:"82%", y:"40%", icon:"",
        title:"Client Data Over Café Wi-Fi",
        char:"Tom", role:"Sales Rep (remote)", avatar:"ID",
        dialogue:"Tom is entering a client's credit card details into a form, laptop balanced on a café table, connected to \"Free_Airport_WiFi.\" \"It's free Wi-Fi, that's basically the same as ours.\"",
        choices:[
          {text:"Connect through the company VPN before handling any client or payment data.", correct:true,
           feedback:"Correct. Public Wi-Fi can be intercepted or spoofed. A VPN encrypts the connection so sensitive data isn't exposed to everyone on the network."},
          {text:"It's fine — the form has a lock icon in the browser.", correct:false,
           feedback:"HTTPS protects the connection to that one site, but it doesn't protect the network itself or stop a rogue hotspot from watching traffic."},
          {text:"Keep working — he'll just be quick about it.", correct:false,
           feedback:"Speed doesn't reduce the risk. Sensitive data shouldn't touch an untrusted network at all without a VPN."}
        ]
      }
    ]
  },
  {
    id:3, name:"Human Resources", tag:"Floor 3 — Confidential... Ish",
    accent:"teal",
    hotspots:[
      {
        id:"f3a", x:"18%", y:"42%", icon:"",
        title:"The Unlocked Filing Cabinet",
        char:"Renee", role:"HR Manager", avatar:"ID",
        dialogue:"Renee gestures at a cabinet stuffed with resumes and SSNs, drawer wide open. \"We lock it... eventually. Usually before the cleaning crew comes.\"",
        choices:[
          {text:"Lock the cabinet now, and shred documents that are no longer needed.", correct:true,

/* ============ STATE ============ */
let state = {
  screen:"title", // title | lobby | floor | ending
  currentFloor:1,
  resolved:{} // hotspotId: true
};

function totalHotspots(){ return FLOORS.reduce((n,f)=>n+f.hotspots.length,0); }
function resolvedCount(){ return Object.keys(state.resolved).length; }
function floorResolvedCount(floor){ return floor.hotspots.filter(h=>state.resolved[h.id]).length; }
function isFloorCleared(floor){ return floorResolvedCount(floor)===floor.hotspots.length; }
function isFloorUnlocked(floorIdx){
  if(floorIdx===0) return true;
  return isFloorCleared(FLOORS[floorIdx-1]);
}

/* ============ RENDER ============ */
const stage = document.getElementById('stage');

function render(){
  stage.innerHTML = "";
  if(state.screen==="title") stage.appendChild(renderTitle());
  else if(state.screen==="registration") stage.appendChild(renderRegistration());
  else if(state.screen==="lobby") stage.appendChild(renderLobby());
  else if(state.screen==="floor") stage.appendChild(renderFloor());
  else if(state.screen==="ending") stage.appendChild(renderEnding());
}

function el(html){
  const d=document.createElement('div');
  d.innerHTML=html.trim();
  return d.firstElementChild;
}

            </label>

            <div style="text-align:center;">
              <button class="btn" id="startSoloBtn">Start Solo Inspection</button>
            </div>
          </div>

          <!-- JOIN TEAM PANEL -->
          <div class="reg-panel" id="panelJoin">
            <div id="joinLoading" style="font-size:13px; margin-bottom:16px; font-style:italic; color:#555;">

            </div>
            
            <div id="joinContent" style="display:none;">
              <label style="display:block; font-weight:bold; margin-bottom:8px; font-size:14px;">Select Team</label>

              <div id="teamMembersPreview" style="font-size:12px; background:var(--wall); border:1px dashed var(--ink); padding:8px 12px; margin-bottom:16px; border-radius:4px;">
                <strong>Current members:</strong> <span id="membersList">None</span>
              </div>
              
              <label style="display:block; font-weight:bold; margin-bottom:8px; font-size:14px;">Your Name</label>
              <input type="text" id="joinName" placeholder="e.g. Alice" style="width:100%; padding:10px; margin-bottom:24px; border:2px solid var(--ink); border-radius:4px; font-family:'Space Mono'; font-size:14px;">
              
              <div style="text-align:center;">
                <button class="btn" id="submitJoinBtn">Join & Enter Lobby</button>
              </div>
            </div>
          </div>

          <!-- CREATE TEAM PANEL -->
          <div class="reg-panel" id="panelCreate">
            <label style="display:block; font-weight:bold; margin-bottom:8px; font-size:14px;">Team Name</label>
            <input type="text" id="teamName" placeholder="e.g. The Cyber Sleuths" style="width:100%; padding:10px; margin-bottom:16px; border:2px solid var(--ink); border-radius:4px; font-family:'Space Mono'; font-size:14px;">
            
            <label style="display:block; font-weight:bold; margin-bottom:8px; font-size:14px;">Team Members (comma separated)</label>
            <input type="text" id="teamMembers" placeholder="e.g. Alice, Bob, Charlie" style="width:100%; padding:10px; margin-bottom:24px; border:2px solid var(--ink); border-radius:4px; font-family:'Space Mono'; font-size:14px;">

              <button class="btn" id="submitTeamBtn">Register & Enter Lobby</button>
            </div>
          </div>

        </div>
        <div class="timestamp">CAM 01 — REGISTRATION</div>
      </div>
    </div>
  `);

  // Tab switching logic
  const tabs = {
    Solo: { tab: wrap.querySelector('#tabSolo'), panel: wrap.querySelector('#panelSolo') },
    Join: { tab: wrap.querySelector('#tabJoin'), panel: wrap.querySelector('#panelJoin') },
    Create: { tab: wrap.querySelector('#tabCreate'), panel: wrap.querySelector('#panelCreate') }
  };

  let activeTeams = {}; // key: team push ID, value: team object

  function switchTab(targetKey) {
    Object.keys(tabs).forEach(key => {
      if (key === targetKey) {
        tabs[key].tab.classList.add('active');
        tabs[key].panel.classList.add('active');
      } else {
        tabs[key].tab.classList.remove('active');
        tabs[key].panel.classList.remove('active');
      }
    });

    if (targetKey === 'Join') {
      loadTeams();
    }
  }

  tabs.Solo.tab.onclick = () => switchTab('Solo');
  tabs.Join.tab.onclick = () => switchTab('Join');
  tabs.Create.tab.onclick = () => switchTab('Create');

  // Load active teams from Firebase
  function loadTeams() {
    const loadingDiv = wrap.querySelector('#joinLoading');
    const contentDiv = wrap.querySelector('#joinContent');
    const selectEl = wrap.querySelector('#joinTeamSelect');
    const membersSpan = wrap.querySelector('#membersList');

    if (!window.db || !window.firebaseGet || !window.firebaseRef) {
      loadingDiv.textContent = "Database connection offline. You can still play Solo or New Team offline.";
      return;
    }

    loadingDiv.textContent = "Connecting to database & loading active teams...";
    loadingDiv.style.display = "block";
    contentDiv.style.display = "none";

    window.firebaseGet(window.firebaseRef(window.db, 'teams'))
      .then(snapshot => {
        if (snapshot.exists()) {
          activeTeams = snapshot.val();
          selectEl.innerHTML = "";
          
          // Add teams to dropdown
          Object.keys(activeTeams).forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = activeTeams[key].teamName || "Unnamed Team";
            selectEl.appendChild(opt);
          });

          // Show info for first team
          const firstKey = Object.keys(activeTeams)[0];
          if (firstKey) {
            membersSpan.textContent = activeTeams[firstKey].teamMembers || "No members listed";
          }

          loadingDiv.style.display = "none";
          contentDiv.style.display = "block";
        } else {
          loadingDiv.textContent = "No active teams found. Create a new team first!";
        }
      })
      .catch(err => {
        loadingDiv.textContent = "Failed to load teams: " + err.message;
      });
  }

  // Update members preview when team selection changes
  wrap.querySelector('#joinTeamSelect').onchange = (e) => {
    const selectedKey = e.target.value;
    const membersSpan = wrap.querySelector('#membersList');
    if (activeTeams[selectedKey]) {
      membersSpan.textContent = activeTeams[selectedKey].teamMembers || "No members listed";
    }
  };

  // Solo start logic
  wrap.querySelector('#startSoloBtn').onclick = () => {
    const sName = wrap.querySelector('#soloName').value.trim();
    const isAnon = wrap.querySelector('#soloAnon').checked;

    if (!isAnon && sName) {
      const btn = wrap.querySelector('#startSoloBtn');
      btn.disabled = true;
      btn.textContent = "Starting...";

      if (window.db && window.firebasePush && window.firebaseRef && window.firebaseSet) {
        const teamsRef = window.firebasePush(window.firebaseRef(window.db, 'teams'));
        window.firebaseSet(teamsRef, {
          teamName: `${sName} (Solo)`,
          teamMembers: sName,
          timestamp: new Date().toISOString()
        }).then(() => {
          state.screen = "lobby";
          render();
        }).catch(err => {
          console.error("Error saving solo run:", err);
          // Proceed anyway on database failure
          state.screen = "lobby";
          render();
        });
      } else {
        state.screen = "lobby";
        render();
      }
    } else {
      // Anonymous or empty name
      state.screen = "lobby";
      render();
    }
  };

  // Join existing team submit logic
  wrap.querySelector('#submitJoinBtn').onclick = () => {
    const selectedKey = wrap.querySelector('#joinTeamSelect').value;
    const newMember = wrap.querySelector('#joinName').value.trim();

    if (!newMember) {
      alert("Please enter your name to join the team.");
      return;
    }

    if (!selectedKey || !activeTeams[selectedKey]) {
      alert("Please select a valid team.");
      return;
    }

    const btn = wrap.querySelector('#submitJoinBtn');
    btn.disabled = true;
    btn.textContent = "Joining...";

    const currentMembers = activeTeams[selectedKey].teamMembers || "";
    const updatedMembers = currentMembers ? `${currentMembers}, ${newMember}` : newMember;

    if (window.db && window.firebaseRef && window.firebaseUpdate) {
      const teamRef = window.firebaseRef(window.db, `teams/${selectedKey}`);
      window.firebaseUpdate(teamRef, {
        teamMembers: updatedMembers
      }).then(() => {
        state.screen = "lobby";
        render();
      }).catch(err => {
        alert("Error joining team: " + err.message);
        btn.disabled = false;
        btn.textContent = "Join & Enter Lobby";
      });
    } else {
      state.screen = "lobby";
      render();
    }
  };

  // New team submit logic
  wrap.querySelector('#submitTeamBtn').onclick = () => {
    const tName = wrap.querySelector('#teamName').value.trim();
    const tMembers = wrap.querySelector('#teamMembers').value.trim();
    
    if(!tName || !tMembers) {
      alert("Please enter both a team name and team members.");
      return;
    }
    
    const btn = wrap.querySelector('#submitTeamBtn');
    btn.disabled = true;
    btn.textContent = "Registering...";

    if(window.db && window.firebasePush && window.firebaseRef && window.firebaseSet) {
      const teamsRef = window.firebasePush(window.firebaseRef(window.db, 'teams'));
      window.firebaseSet(teamsRef, {
        teamName: tName,
        teamMembers: tMembers,
        timestamp: new Date().toISOString()
      }).then(() => {
        state.screen="lobby"; 
        render();
      }).catch(err => {
        alert("Error saving team: " + err.message);
        btn.disabled = false;
        btn.textContent = "Register & Enter Lobby";
      });
    } else {
      state.screen="lobby";
      render();
    }
  };

  return wrap;
}

    const hs = el(`
      <div class="hotspot ${isResolved?'resolved':''}" style="left:${h.x}; top:${h.y};" title="${h.title}">
        <span class="icon">${searchSvg}</span>
        <span class="check">✔</span>
      </div>
    `);
    hs.onclick = ()=>{ if(!isResolved) openInvestigation(floor, h); };
    room.appendChild(hs);
  });

  wrap.querySelector('#backBtn').onclick = ()=>{ state.screen="lobby"; render(); };
  return wrap;
}

function openInvestigation(floor, hotspot){
  const overlay = el(`<div class="modal-overlay"></div>`);
  const modal = el(`
    <div class="modal crt-frame">
      <div class="crt-inner">
        <div class="rec-tag"><span class="rec-dot"></span>REC</div>
        <div class="modal-body">
          <div class="issue-title">${hotspot.title}</div>
          <div class="char-row">
            <div class="avatar">${hotspot.avatar}</div>
            <div>
              <div class="char-name">${hotspot.char}</div>
              <div class="char-role">${hotspot.role}</div>
            </div>
          </div>
          <div class="dialogue">${hotspot.dialogue}</div>
          <div class="choices" id="choicesWrap"></div>
          <div id="feedbackWrap"></div>
          <div class="modal-actions" id="actionsWrap"></div>
        </div>
        <div class="timestamp">CASE FILE — ${floor.name.toUpperCase()}</div>
      </div>
    </div>
  `);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  const choicesWrap = modal.querySelector('#choicesWrap');
  const feedbackWrap = modal.querySelector('#feedbackWrap');
  const actionsWrap = modal.querySelector('#actionsWrap');

  function showChoices(){
    choicesWrap.innerHTML = "";
    feedbackWrap.innerHTML = "";
    actionsWrap.innerHTML = "";
    const shuffledChoices = [...hotspot.choices].sort(() => Math.random() - 0.5);
    shuffledChoices.forEach(choice=>{
      const cbtn = el(`<button class="choice-btn">${choice.text}</button>`);
      cbtn.onclick = ()=>{
        choicesWrap.innerHTML = "";
        feedbackWrap.innerHTML = `<div class="feedback ${choice.correct?'correct':'wrong'}">${choice.correct?'✔ RESOLVED — ':'✘ NOT QUITE — '}${choice.feedback}</div>`;
        if(choice.correct){
          state.resolved[hotspot.id] = true;
          actionsWrap.innerHTML = "";
          const doneBtn = el(`<button class="btn small">Close Case File</button>`);
          doneBtn.onclick = ()=>{ document.body.removeChild(overlay); render(); };
          actionsWrap.appendChild(doneBtn);
        } else {
          const retryBtn = el(`<button class="btn small secondary">Try Again</button>`);
          retryBtn.onclick = showChoices;
          actionsWrap.innerHTML = "";
          actionsWrap.appendChild(retryBtn);
        }
      };
      choicesWrap.appendChild(cbtn);
    });
  }
  showChoices();

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ document.body.removeChild(overlay); render(); } });
}

function renderEnding(){
  const wrap = el(`
    <div class="crt-frame">
      <div class="crt-inner">
        <div class="rec-tag"><span class="rec-dot"></span>REC</div>
        <div class="marquee">
          <h1 style="font-size:28px;">Audit Complete</h1>
          <div class="sub">FINAL REPORT — UNSAFE BUSINESS INC.</div>
        </div>
        <div class="ending">
          <div class="certificate">
            <h2>Certificate of Cyber Vigilance</h2>
            <div class="line">Awarded to <b>The Inspector</b></div>
            <div class="line">for resolving all <b>${totalHotspots()}</b> unsafe practices across <b>${FLOORS.length}</b> floors of UNSAFE Business Inc.</div>
            <div class="line sticky">Case status: CLOSED ✔</div>
          </div>
          <div class="recap">
            <h3 style="font-size:14px; margin-bottom:8px;">What got fixed, floor by floor:</h3>
            ${FLOORS.map(f=>`
              <div style="margin-bottom:10px;">
                <b>${f.name}</b>
                <ul>${f.hotspots.map(h=>`<li>${h.title}</li>`).join("")}</ul>
              </div>
            `).join("")}
          </div>
          <div style="margin-top:10px;">
            <button class="btn" id="againBtn">Restart Investigation</button>
          </div>
        </div>
        <div class="timestamp">CAM FINAL — DEBRIEF ROOM</div>
      </div>
    </div>
  `);
  wrap.querySelector('#againBtn').onclick = ()=>{
    state = { screen:"title", currentFloor:1, resolved:{} };
    render();
  };
  return wrap;
}

render();
</script>
</body>
</html>
