<style>

  }
  .crt-inner {
    position: relative;
    border-radius: 7px;
    overflow: hidden;
    background: var(--paper);
  }
  .crt-inner::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 2px, transparent 3px);
    pointer-events: none;
    mix-blend-mode: multiply;
    z-index: 5;
  }
  .crt-inner::after {
    content: "";
    position: absolute; inset: 0;

  }
  .rec-tag {

<script>
/* ============================================================
   DATA

/* ---- LEVEL 1: Spot the Weak ---- */
const L1_PASSWORDS = [
  {
    pw: "password",
    isStrong: false,
    why: "\"password\" is the #1 most-used password in the world. It's in every hacker's dictionary and will be cracked in under a second.",
    strength: 5
  },
  {
    pw: "123456",
    isStrong: false,
    why: "Pure sequential numbers — attackers try these first. It has no letters, no symbols, and zero unpredictability.",
    strength: 3
  },
  {
    pw: "Tr0ub4dor&3",
    isStrong: true,
    why: "Long, mixes uppercase, numbers, and a symbol — and it doesn't appear in any dictionary. This one holds up well.",
    strength: 92
  },
  {
    pw: "sunshine",
    isStrong: false,
    why: "A single common English word. Password crackers run through every word in the dictionary — this takes seconds.",
    strength: 10
  },
  {
    pw: "P@ssw0rd!",
    isStrong: false,
    why: "This looks strong but it's a very well-known substitution pattern (@ for a, 0 for o). Crack tools know all these tricks.",
    strength: 28
  },
  {
    pw: "c#Wq9!mZ$vR2",
    isStrong: true,
    why: "Random mix of upper, lower, numbers, and symbols — 12 characters long. This would take centuries to crack by brute force.",
    strength: 98
  }
];

/* ---- LEVEL 2: Password Upgrader ---- */
const L2_SCENARIOS = [
  {
    weak: "fluffy",
    hint: "Your cat's name. Short, all lowercase, a simple word.",
    choices: [
      { text: "Fluffy_1s_My_C4t!",      label: "B", points: 95 },
      { text: "F1uffy!",                label: "A", points: 30 },
      { text: "Fluffy_2024_!",          label: "C", points: 40 }
    ],
    correct: "B",
    feedback: {
      A: "Common character substitution (1 for l) and adding a symbol at the end is very predictable for cracking tools.",
      B: "A long passphrase is much harder to crack than a single word, even with substitutions. Length is your best defense.",
      C: "Appending the current year and a symbol is one of the most common ways people try to make passwords complex. It's still easily guessable."
    }
  },
  {
    weak: "summer2024",
    hint: "A season + year. Very predictable — millions of people use this formula.",
    choices: [
      { text: "W!nt3r#2025",           label: "B", points: 45 },
      { text: "Svmmer!_VacaT10n_@24",  label: "C", points: 96 },
      { text: "$ummer2024!",           label: "A", points: 25 }
    ],
    correct: "C",
    feedback: {
      A: "Replacing 'S' with '$' and adding '!' is barely an upgrade. It's still the exact same predictable pattern.",
      B: "Changing the season and incrementing the year is better, but still follows the easily guessable season+year format.",
      C: "Adding additional words, mixing cases, and separating with symbols creates a long, unpredictable passphrase."
    }
  },
  {
    weak: "qwerty",
    hint: "Keyboard row sequence. Often the top-5 most-breached password worldwide.",
    choices: [

}

function renderL1() {
  const item = L1_PASSWORDS[state.l1Index];
  const revealed = state.l1Phase === "reveal";
  const isLast = state.l1Index >= L1_PASSWORDS.length - 1;

  // compute strength bar color
  const s = item.strength;
  const barColor = s < 30 ? '#B23B3B' : s < 60 ? '#D9A441' : '#3F7A4D';
  const strengthLabel = s < 30 ? 'VERY WEAK' : s < 50 ? 'WEAK' : s < 75 ? 'MODERATE' : 'STRONG';

  let feedbackHtml = "";
  if (revealed) {
    const correct = (state.l1UserChoice === "weak") === (!item.isStrong);
    feedbackHtml = `
      <div class="feedback-banner ${correct ? 'correct' : 'wrong'}">
        <div class="feedback-icon">${correct ? '✔' : '✘'}</div>
        <div>
          <b>${correct ? 'Correct!' : `Not quite — this password is ${item.isStrong ? 'STRONG' : 'WEAK'}.`}</b><br>
          ${item.why}
        </div>
      </div>
    `;
  }

  const wrap = el(`
    <div class="crt-frame">
      <div class="crt-inner">
        <div class="rec-tag"><span class="rec-dot"></span>REC</div>
        ${renderSecureHud('Spot the Weak', `${state.l1Index + 1}/${L1_PASSWORDS.length} passwords`, secureTotalScore())}

          </div>
          <div class="progress-pill">${state.l1Index + 1} / ${L1_PASSWORDS.length}</div>
        </div>
        <div class="password-stage">
          <div class="pw-card">
            <div class="pw-counter">PASSWORD ${state.l1Index + 1} OF ${L1_PASSWORDS.length}</div>
            <div class="pw-display" id="pwDisplay">${item.pw}</div>
            <div class="strength-bar-wrap">
              <div class="strength-bar" id="strengthBar" style="width:${revealed ? item.strength : 0}%; background:${barColor};"></div>
            </div>
            ${revealed ? `<div style="font-size:11px; color:${barColor}; letter-spacing:2px; font-weight:700; margin-bottom:12px;">${strengthLabel}</div>` : `<div style="font-size:11px; color:rgba(255,255,255,0.3); letter-spacing:2px; margin-bottom:12px;">••••••</div>`}
            <div class="pw-actions" id="pwActions">
              ${!revealed ? `
                <button class="pw-btn-weak" id="btnWeak">✘ WEAK</button>
                <button class="pw-btn-strong" id="btnStrong">✔ STRONG</button>
              ` : ''}
            </div>
          </div>

          <div style="width:100%; max-width:520px;">
            ${feedbackHtml}
            ${revealed ? `
              <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <div style="font-family:'Space Mono'; font-size:12px; color:#555;">Score: <b>${state.l1Score}</b> / ${state.l1Index + 1}</div>
                <button class="btn ${isLast ? 'good' : ''}" id="nextBtn">
                  ${isLast ? 'See Results →' : 'Next Password →'}
                </button>
              </div>
            ` : ''}
          </div>

          <div style="width:100%; max-width:520px; text-align:left; margin-top:4px;">
            <button class="btn secondary small" id="quitL1Btn">← Back to Levels</button>
          </div>
        </div>
        <div class="timestamp">LEVEL 1 — SPOT THE WEAK</div>
      </div>
    </div>
  `);

  if (!revealed) {
    const judge = (choice) => {
      state.l1UserChoice = choice;
      state.l1Phase = "reveal";
      const correct = (choice === "weak") === (!item.isStrong);
      if (correct) state.l1Score++;
      render();
    };
    wrap.querySelector('#btnWeak').onclick = () => judge("weak");
    wrap.querySelector('#btnStrong').onclick = () => judge("strong");
  } else {
    wrap.querySelector('#nextBtn').onclick = () => {
      if (isLast) {
        state.levelsCleared.l1 = true;
        state.screen = "l2"; // auto-advance to L2 intro? No — go to hub
        // go to ending for L1
        state.screen = "hub";
        // Actually let's show hub with l1 cleared so user sees progress
        // But to feel rewarding let's go to l2 start
        state.l2Index = 0; state.l2Score = 0; state.l2Phase = "choose"; state.l2UserChoice = null;
        state.screen = "hub";
        render();
      } else {
        state.l1Index++;
        state.l1Phase = "guess";
        state.l1UserChoice = null;
        render();
      }
    };
  }
  wrap.querySelector('#quitL1Btn').onclick = () => { state.screen = "hub"; render(); };

  // animate bar after render
  if (revealed) {
    setTimeout(() => {
      const bar = wrap.querySelector('#strengthBar');
      if (bar) { bar.style.width = item.strength + '%'; }
    }, 50);
  }

  return wrap;
}

/* ============================================================
   LEVEL 2 — PASSWORD UPGRADER
   ============================================================ */
function renderL2() {
  const scenario = L2_SCENARIOS[state.l2Index];
  const revealed = state.l2Phase === "reveal";
  const isLast = state.l2Index >= L2_SCENARIOS.length - 1;

  let choicesHtml = scenario.choices.map(c => `
    <div class="upgrade-choice ${
      revealed
        ? (c.label === scenario.correct ? 'reveal-correct' : (c.label === state.l2UserChoice ? 'selected-wrong' : ''))
        : ''
    }" data-label="${c.label}">
      <div class="badge-letter" style="${
        revealed && c.label === scenario.correct ? 'background:var(--good)' :
        revealed && c.label === state.l2UserChoice && c.label !== scenario.correct ? 'background:var(--danger)' : ''
      }">${c.label}</div>
      <span style="letter-spacing:2px; font-size:14px;">${c.text}</span>
      ${revealed && c.label === scenario.correct ? '<span style="margin-left:auto; color:var(--good); font-size:18px;">✔</span>' : ''}
      ${revealed && c.label === state.l2UserChoice && c.label !== scenario.correct ? '<span style="margin-left:auto; color:var(--danger); font-size:18px;">✘</span>' : ''}
    </div>
  `).join('');

  let feedbackHtml = "";
  if (revealed) {
    const correct = state.l2UserChoice === scenario.correct;
    feedbackHtml = `
      <div class="feedback-banner ${correct ? 'correct' : 'wrong'}">
        <div class="feedback-icon">${correct ? '✔' : '✘'}</div>
        <div>
          <b>${correct ? 'Correct!' : 'Not the best choice.'}</b><br>
          ${scenario.feedback[state.l2UserChoice]}<br>
          ${!correct ? `<br><b>Why ${scenario.correct} was best:</b> ${scenario.feedback[scenario.correct]}` : ''}
        </div>
      </div>
    `;
  }

  const wrap = el(`
    <div class="crt-frame">
      <div class="crt-inner">
        <div class="rec-tag"><span class="rec-dot"></span>REC</div>
        ${renderSecureHud('Upgrade It', `${state.l2Index + 1}/${L2_SCENARIOS.length} passwords`, secureTotalScore())}
        <div class="scene-header">
          <div>
            <h2>Level 2 — Upgrade It</h2>
            <div class="ftag">Pick the strongest improved password</div>
          </div>
          <div class="progress-pill">${state.l2Index + 1} / ${L2_SCENARIOS.length}</div>
        </div>
        <div class="upgrade-stage">
          <div class="upgrade-scenario">
            <div class="upgrade-label">Weak password to upgrade:</div>
            <div class="upgrade-weak-pw">${scenario.weak}</div>
            <div style="font-size:12px; color:#666; margin-top:6px; font-style:italic;">${scenario.hint}</div>
          </div>
          <div style="font-family:'Space Mono'; font-weight:700; font-size:12px; color:var(--burgundy); margin-bottom:10px; letter-spacing:1px;">
            ${revealed ? 'Review the options:' : 'Which version is the strongest upgrade?'}
          </div>
          <div class="upgrade-choices" id="choiceList">
            ${choicesHtml}
          </div>
          ${feedbackHtml}
          ${revealed ? `
            <div style="margin-top:18px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
              <div style="font-family:'Space Mono'; font-size:12px; color:#555;">Score: <b>${state.l2Score}</b> / ${state.l2Index + 1}</div>
              <button class="btn ${isLast ? 'good' : ''}" id="nextL2Btn">
                ${isLast ? 'Finish Level 2 →' : 'Next Password →'}
              </button>
            </div>
          ` : ''}
          <div style="margin-top:16px; text-align:left;">
            <button class="btn secondary small" id="quitL2Btn">← Back to Levels</button>
          </div>
        </div>
        <div class="timestamp">LEVEL 2 — PASSWORD UPGRADER</div>
      </div>
    </div>
  `);

  if (!revealed) {
    wrap.querySelectorAll('.upgrade-choice').forEach(card => {
      card.onclick = () => {
        const label = card.getAttribute('data-label');
        state.l2UserChoice = label;
        state.l2Phase = "reveal";
        if (label === scenario.correct) state.l2Score++;
        render();
      };
    });
  } else {
    wrap.querySelector('#nextL2Btn').onclick = () => {
      if (isLast) {
        state.levelsCleared.l2 = true;
        state.screen = "hub"; render();
      } else {
        state.l2Index++;
        state.l2Phase = "choose";
        state.l2UserChoice = null;
        render();
      }
    };
  }
  wrap.querySelector('#quitL2Btn').onclick = () => { state.screen = "hub"; render(); };
  return wrap;
}

/* ============================================================
   LEVEL 3 — CRACK THE PASSWORD
   ============================================================ */
function renderL3() {
  const profile = L3_PROFILES[state.l3ProfileIndex];
  const slots = state.l3SlotStates;
  const allDone = slots.every(s => s === "solved" || s === "failed");
  const isLastProfile = state.l3ProfileIndex >= L3_PROFILES.length - 1;
  const completedPasswords = L3_PROFILES.slice(0, state.l3ProfileIndex).reduce((count, item) => count + item.passwords.length, 0) + slots.filter(slot => slot !== "pending").length;
  const totalPasswords = L3_PROFILES.reduce((count, item) => count + item.passwords.length, 0);

  let slotsHtml = profile.passwords.map((pw, i) => {
    const slotState = slots[i]; // pending | solved | failed
    const isCurrent = (slotState === "pending") && slots.slice(0, i).every(s => s !== "pending");
    // Actually allow current slot = first pending
    const firstPending = slots.findIndex(s => s === "pending");
    const isActive = i === firstPending && slotState === "pending";
    const pipsHtml = Array.from({length: 3}).map((_, p) => {
      if (slotState === "solved") return `<div class="pip" style="background:var(--good); border-color:var(--good);"></div>`;
      if (slotState === "failed") return `<div class="pip used"></div>`;
      if (isActive) {
        return `<div class="pip ${p < state.l3Attempts ? 'used' : 'empty'}"></div>`;
      }
      return `<div class="pip empty"></div>`;
    }).join('');

    let statusBadge = "";
    if (slotState === "solved") statusBadge = `<span style="color:var(--good); font-weight:700; font-size:12px; letter-spacing:1px;">✔ CRACKED</span>`;
    if (slotState === "failed") statusBadge = `<span style="color:var(--danger); font-weight:700; font-size:12px; letter-spacing:1px;">✘ REVEALED: <span style="font-family:'Space Mono';">${pw.answer}</span></span>`;

    return `
      <div class="crack-slot ${slotState !== 'pending' ? slotState : ''}" id="slot-${i}">
        <div class="crack-slot-label">Password ${i + 1} of ${profile.passwords.length}</div>
        <div style="font-size:12px; font-style:italic; color:#666; margin-bottom:8px;">${pw.hint}</div>
        <div class="crack-hidden" style="color:${slotState === 'solved' ? 'var(--good)' : slotState === 'failed' ? 'var(--danger)' : 'var(--ink)'};">
          ${slotState === 'solved' ? pw.answer : slotState === 'failed' ? pw.answer : pw.display}
        </div>
        ${slotState !== 'pending' ? `
          <div class="feedback-banner ${slotState === 'solved' ? 'correct' : 'wrong'}" style="margin-top:8px; margin-bottom:0;">
            <div class="feedback-icon">${slotState === 'solved' ? '⚠️' : '⚠️'}</div>
            <div><b>Why this is risky:</b> ${pw.explain}</div>
          </div>
        ` : ''}
        ${isActive ? `
          <div class="crack-input-row" id="crackRow-${i}">
            <input class="crack-input" type="text" id="crackInput-${i}" placeholder="Type your guess…" autocomplete="off" autocapitalize="off">
            <button class="btn small" id="crackBtn-${i}">Guess</button>
          </div>
          <div class="attempts-pips">${pipsHtml}</div>
          <div id="crackMsg-${i}" style="font-size:12px; color:var(--danger); margin-top:6px; min-height:18px;"></div>
        ` : `
          <div class="attempts-pips">${pipsHtml}</div>
          ${statusBadge}
        `}
      </div>
    `;
  }).join('');

  const wrap = el(`
    <div class="crt-frame">
      <div class="crt-inner">
        <div class="rec-tag"><span class="rec-dot"></span>REC</div>
        ${renderSecureHud('Crack It', `${completedPasswords}/${totalPasswords} passwords`, secureTotalScore())}
        <div class="scene-header">
          <div>
            <h2>Level 3 — Crack It</h2>
            <div class="ftag">Use the clues to guess their passwords</div>
          </div>
          <div class="progress-pill">PROFILE ${state.l3ProfileIndex + 1} / ${L3_PROFILES.length}</div>
        </div>
        <div class="crack-stage">
          <div class="profile-card">
            <div class="profile-avatar">${profile.emoji}</div>
            <div class="profile-info">
              <div class="profile-name">${profile.name}</div>
              <div class="profile-facts">
                ${profile.facts.map(f => `<span class="fact-chip">${f}</span>`).join('')}
              </div>
            </div>
          </div>

          <div style="font-family:'Space Mono'; font-weight:700; font-size:12px; color:var(--burgundy); margin-bottom:14px; letter-spacing:1px;">
            Guess the 3 passwords. You have <b>${MAX_L3_ATTEMPTS} attempts</b> per password.
          </div>

          <div class="crack-slots">
            ${slotsHtml}
          </div>

          ${allDone ? `
            <div style="margin-top:20px; padding:14px; background:var(--paper); border:2px solid var(--ink); border-radius:6px; font-size:13px; line-height:1.6;">
              <b style="font-family:'Alfa Slab One'; color:var(--burgundy);">The lesson:</b> These passwords were built from public profile information.
              A determined attacker doesn't need to run complex software — they just read your social media.
              Never use names, dates, places, or hobbies in your passwords.
            </div>
            <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
              <div style="font-family:'Space Mono'; font-size:12px; color:#555;">
                Cracked: <b>${slots.filter(s=>s==='solved').length}</b> / ${profile.passwords.length}
              </div>
              <button class="btn good" id="nextProfileBtn">
                ${isLastProfile ? 'See Final Score →' : 'Next Profile →'}
              </button>
            </div>
          ` : ''}

          <div style="margin-top:16px; text-align:left;">
            <button class="btn secondary small" id="quitL3Btn">← Back to Levels</button>
          </div>
        </div>
        <div class="timestamp">LEVEL 3 — CRACK THE PASSWORD</div>
      </div>
    </div>
  `);

  // Wire up guess buttons for active slots
  const firstPending = slots.findIndex(s => s === "pending");
  if (firstPending !== -1) {
    const inputEl = wrap.querySelector(`#crackInput-${firstPending}`);
    const btnEl = wrap.querySelector(`#crackBtn-${firstPending}`);
    const msgEl = wrap.querySelector(`#crackMsg-${firstPending}`);
    const pw = profile.passwords[firstPending];

    const submitGuess = () => {
      const guess = inputEl.value.trim().toLowerCase();
      if (!guess) return;

      if (guess === pw.answer.toLowerCase()) {
        slots[firstPending] = "solved";
        state.l3Score++;
        state.l3Attempts = 0;
        render();
      } else {
        state.l3Attempts++;
        if (state.l3Attempts >= MAX_L3_ATTEMPTS) {
          slots[firstPending] = "failed";
          state.l3Attempts = 0;
          render();
        } else {
          const remaining = MAX_L3_ATTEMPTS - state.l3Attempts;
          msgEl.textContent = `✘ Wrong! ${remaining} attempt${remaining === 1 ? '' : 's'} remaining.`;
          inputEl.value = "";
          // update pips visually
          wrap.querySelectorAll(`#slot-${firstPending} .pip`).forEach((pip, p) => {
            pip.className = 'pip ' + (p < state.l3Attempts ? 'used' : 'empty');
          });
        }
      }
    };

    btnEl.onclick = submitGuess;
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') submitGuess(); });
  }

  if (allDone) {
    wrap.querySelector('#nextProfileBtn').onclick = () => {
      if (isLastProfile) {
        state.levelsCleared.l3 = true;
        state.screen = "ending"; render();
      } else {
        state.l3ProfileIndex++;
        state.l3PwIndex = 0;
        state.l3Attempts = 0;
        state.l3SlotStates = L3_PROFILES[state.l3ProfileIndex].passwords.map(() => "pending");
        render();
      }
    };
  }
  wrap.querySelector('#quitL3Btn').onclick = () => { state.screen = "hub"; render(); };
  return wrap;
}

/* ============================================================
   ENDING
   ============================================================ */
function renderEnding() {
  const l1Score = state.l1Score;
  const l2Score = state.l2Score;
  const l3Score = state.l3Score;
  const total = l1Score + l2Score + l3Score;
  const maxTotal = L1_PASSWORDS.length + L2_SCENARIOS.length + (L3_PROFILES.length * 3);

  const pct = Math.round((total / maxTotal) * 100);
  const run={secureTeamName:state.teamName,secureScore:total,secureMax:maxTotal,scorePercent:pct,isSolo:state.isSolo,timestamp:new Date().toISOString()};
  if(!state.anonymous)try{const runs=JSON.parse(localStorage.getItem('secureRuns')||'[]');runs.push(run);localStorage.setItem('secureRuns',JSON.stringify(runs));}catch(e){}
  if(window.db&&window.firebaseUpdate&&state.teamKey)window.firebaseUpdate(window.firebaseRef(window.db,`secure_teams/${state.teamKey}`),{secureScore:total,secureMax:maxTotal,scorePercent:pct,completed:true,timestamp:run.timestamp}).catch(()=>{});
  const grade = pct >= 90 ? "Password Pro 🏆" : pct >= 70 ? "Security Savvy 🛡️" : pct >= 50 ? "Getting There 📈" : "Keep Practising 🔐";
  const msg = pct >= 90
    ? "Exceptional! You spotted every trap, chose the best upgrades, and cracked the risky passwords. You're security-aware."
    : pct >= 70
    ? "Good work. You've got a solid grip on password security basics. Review the ones you missed."
    : pct >= 50
    ? "You understand some of the principles — keep practising to build strong habits."
    : "Password security takes time to learn. Review the feedback and try again!";

  const wrap = el(`
    <div class="crt-frame">
      <div class="crt-inner">
        <div class="rec-tag"><span class="rec-dot"></span>REC</div>
        ${renderSecureHud('Training Complete', `${maxTotal}/${maxTotal} challenges`, `${total}/${maxTotal}`)}
        <div class="marquee">
          <h1>Training Complete!</h1>
          <div class="sub">MAKE ME SECURE — FINAL RESULTS</div>
        </div>
        <div class="ending">
          <div style="font-size:64px; margin-bottom:10px;">🔐</div>
          <div class="certificate">
            <h2>Certificate of Completion</h2>
            <div style="font-size:12px; color:#888; margin-bottom:16px; letter-spacing:1px;">MAKE ME SECURE — PASSWORD TRAINING</div>
            <div class="score-big">${total}<span style="font-size:28px; color:#888;">/${maxTotal}</span></div>
            <div class="score-label">${pct}% — ${grade}</div>
            <div style="font-size:13px; line-height:1.65; color:#444;">${msg}</div>
            <div class="score-breakdown">
              <div>🔍 Level 1 — Spot the Weak: <b>${l1Score} / ${L1_PASSWORDS.length}</b></div>
              <div>⬆️ Level 2 — Upgrade It: <b>${l2Score} / ${L2_SCENARIOS.length}</b></div>
              <div>💀 Level 3 — Crack It: <b>${l3Score} / ${L3_PROFILES.length * 3}</b> passwords cracked</div>
            </div>
          </div>

          <div style="margin-top:8px; padding:14px 18px; background:var(--paper); border:2px solid var(--ink); border-radius:6px; max-width:500px; margin-left:auto; margin-right:auto; text-align:left; font-size:12.5px; line-height:1.7;">
            <b style="font-family:'Alfa Slab One'; color:var(--mustard-dark); font-size:14px;">3 Habits to Take Away</b><br>
            <span style="color:var(--good);">✔</span> Use a <b>password manager</b> — stop memorising, start generating.<br>
            <span style="color:var(--good);">✔</span> Make passwords <b>long &amp; random</b> — 12+ characters, no real words.<br>
            <span style="color:var(--good);">✔</span> Enable <b>MFA everywhere</b> — a strong password + MFA is almost unbreakable.
          </div>

          <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:24px;">
            <button class="btn" id="playAgainBtn">Play Again</button>
            <button class="btn secondary" id="backToHubBtn">← Back to Main Hub</button>
          </div>
        </div>
        <div class="timestamp">MAKE ME SECURE — COMPLETE</div>
      </div>
    </div>
  `);

  wrap.querySelector('#playAgainBtn').onclick = () => {
    state.screen = "registration";
    state.l1Index = 0; state.l1Score = 0; state.l1Phase = "guess"; state.l1UserChoice = null;
    state.l2Index = 0; state.l2Score = 0; state.l2Phase = "choose"; state.l2UserChoice = null;
    state.l3ProfileIndex = 0; state.l3PwIndex = 0; state.l3Score = 0; state.l3Attempts = 0;
    state.l3SlotStates = L3_PROFILES[0].passwords.map(() => "pending");
    state.levelsCleared = { l1: false, l2: false, l3: false };
    render();
  };
  wrap.querySelector('#backToHubBtn').onclick = () => { window.location.href = 'index.html?map=1'; };
  return wrap;
}

/* ============================================================
   BOOT
   ============================================================ */
state.l3SlotStates = L3_PROFILES[0].passwords.map(() => "pending");
window.onSecureFirebaseInit = () => {
  if (state.screen === 'registration') loadSecureTeams();
  startHandoffTeam();
};
render();
</script>
</body>
</html>
