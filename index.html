<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --wall:#E4D9BE;
    --wall-dark:#D3C6A2;
    --tile-a:#C9BFA0;
    --tile-b:#AFA37F;
    --teal:#2F6B67;
    --teal-dark:#1B4643;
    --burgundy:#8B3A4A;
    --burgundy-dark:#642A35;
    --mustard:#D9A441;
    --mustard-dark:#B4832C;
    --navy:#232336;
    --paper:#F4EEDD;
    --crt-green:#39FF6E;
    --crt-amber:#FFB000;
    --ink:#232336;
    --danger:#B23B3B;
    --good:#3F7A4D;
    font-family:'Space Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--navy);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  #app{
    position:relative;
    width:100%;
    min-height:100vh;
    background:
      linear-gradient(rgba(35, 35, 54, 0.65), rgba(35, 35, 54, 0.85)),
      url('./bg.png') center/cover no-repeat fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .stage{
    width:100%;
    max-width:960px;
    position:relative;
  }
  h1,h2,h3{font-family:'Alfa Slab One',serif; margin:0; letter-spacing:0.5px;}
  .badge{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:4px 10px;
    border:2px solid currentColor;
    border-radius:2px;
  }

  /* ---------- SCANLINE / CRT FRAME (signature element) ---------- */
  .crt-frame{
    position:relative;
    background:#0d1410;
    border-radius:10px;
    padding:3px;
    box-shadow:0 0 0 3px #111, 0 18px 40px rgba(0,0,0,0.55), inset 0 0 30px rgba(0,0,0,0.8);
  }
  .crt-inner{
    position:relative;
    border-radius:7px;
    overflow:hidden;
    background:var(--paper);
  }
  .crt-inner::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.06) 0px,
      rgba(0,0,0,0.06) 1px,
      transparent 2px,
      transparent 3px
    );
    pointer-events:none;
    mix-blend-mode:multiply;
    z-index:5;
  }
  .crt-inner::after{
    content:"";
    position:absolute; inset:0;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.35);
    pointer-events:none;
    z-index:6;
  }
  .rec-tag{
    position:absolute; top:10px; right:14px; z-index:8;
    font-size:11px; font-weight:700; color:#ff4d4d;
    display:flex; align-items:center; gap:6px;
    text-shadow:0 0 6px rgba(255,0,0,0.6);
    letter-spacing:1px;
  }
  .rec-dot{
    width:8px;height:8px;border-radius:50%;background:#ff4d4d;
    animation:blink 1s infinite;
  }
  @keyframes blink{ 50%{opacity:0.15;} }
  .timestamp{
    position:absolute; bottom:10px; left:14px; z-index:8;
    font-size:10px; color:rgba(35,35,54,0.55); letter-spacing:1px;
  }

  /* ---------- TITLE SCREEN ---------- */
  .title-screen{ text-align:center; padding:48px 28px 40px; }
  .marquee{
    background:var(--burgundy);
    color:var(--paper);
    padding:22px 16px 18px;
    border-bottom:6px solid var(--mustard);
    margin:-3px -3px 0 -3px;
    border-radius:7px 7px 0 0;
  }
  .marquee h1{ font-size:clamp(28px,5vw,46px); color:var(--paper); text-shadow:3px 3px 0 var(--burgundy-dark);}
  .marquee .sub{ font-family:'Space Mono',monospace; font-size:13px; letter-spacing:3px; margin-top:8px; opacity:0.9;}
  .building-icon{ font-size:64px; margin:18px 0 6px; }
  .title-copy{ max-width:560px; margin:0 auto; line-height:1.6; font-size:14px; color:#3a3a2e;}
  .role-card{
    display:inline-block;
    background:var(--wall);
    border:2px dashed var(--teal-dark);
    padding:12px 18px;
    margin:18px 0;
    font-size:13px;
    text-align:left;
    max-width:480px;
  }
  .role-card b{color:var(--teal-dark);}
  .btn{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:13px 26px;
    border:3px solid var(--ink);
    border-radius:4px;
    cursor:pointer;
    background:var(--mustard);
    color:var(--navy);
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .08s ease;
  }
  .btn:hover{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
  .btn:active{ transform:translate(4px,4px); box-shadow:0 0 0 var(--ink); }
  .btn.secondary{ background:var(--paper); }
  .btn.good{ background:var(--good); color:var(--paper); }
  .btn.small{ padding:8px 14px; font-size:11px; box-shadow:3px 3px 0 var(--ink);}
  .btn:disabled{opacity:0.4; cursor:not-allowed; box-shadow:2px 2px 0 var(--ink);}

  /* ---------- LOBBY / ELEVATOR ---------- */
  .lobby{ padding:22px; }
  .lobby-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .directory{
    background:var(--paper);
    border:2px solid var(--ink);
    padding:10px 14px;
    font-size:11px;
    margin-bottom:16px;
  }
  .floor-list{ display:flex; flex-direction:column; gap:10px; }
  .floor-btn{
    display:flex; align-items:center; gap:14px;
    background:var(--wall);
    border:2px solid var(--ink);
    border-left:10px solid var(--teal);
    padding:12px 14px;
    cursor:pointer;
    text-align:left;
    font-family:'Space Mono',monospace;
  }
  .floor-btn.locked{ opacity:0.45; cursor:not-allowed; border-left-color:#999; }
  .floor-btn.cleared{ border-left-color:var(--good); background:#e9f0e4; }
  .floor-num{
    font-family:'Alfa Slab One',serif;
    font-size:26px;
    color:var(--teal-dark);
    width:44px; text-align:center; flex-shrink:0;
  }
  .floor-btn.cleared .floor-num{ color:var(--good); }
  .floor-info{ flex:1; }
  .floor-info .fname{ font-weight:700; font-size:14px; }
  .floor-info .ftag{ font-size:11px; color:#555; }
  .floor-status{ font-size:11px; font-weight:700; letter-spacing:1px; white-space:nowrap;}
  .status-locked{ color:#888; }
  .status-open{ color:var(--burgundy);}
  .status-clear{ color:var(--good);}

  /* ---------- FLOOR SCENE ---------- */
  .floor-scene{ position:relative; }
  .scene-header{
    background:var(--teal-dark);
    color:var(--paper);
    padding:12px 16px;
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:8px;
    border-bottom:5px solid var(--mustard);
  }
  .scene-header h2{ font-size:18px; color:var(--paper); }
  .scene-header .ftag{ font-size:11px; opacity:0.85;}
  .progress-pill{
    background:rgba(0,0,0,0.25);
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
  }
  .room{
    position:relative;
    height:420px;
    background:#222;
    overflow:hidden;
  }
  .wall-strip{ display:none; }
  .furniture{ position:absolute; }
  .desk{ width:150px; height:60px; background:#7a5a3a; border-radius:3px; box-shadow:0 6px 0 #543c26; }
  .monitor{ width:70px; height:52px; background:#3a3a3a; border-radius:4px; padding:5px; }
  .monitor-screen{ width:100%; height:100%; background:#0f2e17; border-radius:2px; box-shadow:inset 0 0 8px var(--crt-green); }
  .cabinet{ width:60px; height:110px; background:#7a8a86; border-radius:2px; box-shadow:0 6px 0 #566862;}
  .cabinet .drawer{ height:24%; margin:4px 6px; background:#5f716c; border-radius:1px;}
  .plant-pot{ width:36px; height:30px; background:#a65d3a; border-radius:0 0 8px 8px; }
  .plant-leaf{ width:44px; height:44px; background:#4c7a4a; border-radius:60% 40% 50% 50%; position:absolute; top:-34px; left:-4px; }
  .cooler{ width:34px; height:90px; background:#dfeaf0; border:2px solid #9fb6bd; border-radius:4px;}
  .cooler-jug{ width:26px; height:30px; background:#7fbfe0aa; border-radius:0 0 12px 12px; margin:2px auto; }
  .door{ width:56px; height:120px; background:#8a6a45; border:3px solid #5c4429; }
  .rug{ width:220px; height:60px; background:var(--burgundy); opacity:0.35; border-radius:6px;}

  .person { position:absolute; width:40px; height:80px; z-index:3; }
  .person-head { width:26px; height:26px; background:#e8b5a2; border-radius:50%; position:absolute; top:0; left:7px; border:2px solid var(--ink);}
  .person-body { width:34px; height:40px; background:var(--burgundy); border-radius:8px 8px 0 0; position:absolute; top:28px; left:3px; border:2px solid var(--ink);}
  .person-legs { width:10px; height:14px; background:var(--navy); position:absolute; top:66px; left:8px; border:2px solid var(--ink); box-shadow: 12px 0 0 var(--navy), 12px 0 0 2px var(--ink);}
  .person.alt-1 .person-body { background:var(--teal); }
  .person.alt-2 .person-body { background:var(--mustard); }
  .person.alt-2 .person-head { background:#c29074; }
  .hotspot{
    position:absolute;
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
    background:var(--mustard);
    border:3px solid var(--ink);
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 0 0 0 rgba(217,164,65,0.6);
    animation:pulse 1.8s infinite;
    z-index:4;
  }
  .hotspot:hover{ transform:scale(1.08); }
  .hotspot.resolved{
    background:var(--good);
    animation:none;
    cursor:default;
    opacity:0.85;
  }
  .hotspot .check{ display:none; }
  .hotspot.resolved .icon{ display:none; }
  .hotspot.resolved .check{ display:block; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(217,164,65,0.55);}
    70%{ box-shadow:0 0 0 14px rgba(217,164,65,0);}
    100%{ box-shadow:0 0 0 0 rgba(217,164,65,0);}
  }

  .scene-footer{
    background:var(--paper);
    padding:10px 16px;
    display:flex; justify-content:space-between; align-items:center;
    border-top:2px solid var(--ink);
    flex-wrap:wrap; gap:8px;
  }
  .hint{ font-size:11px; color:#555; }

  /* ---------- MODAL / CONFESSION CAM ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,10,16,0.72);
    display:flex; align-items:center; justify-content:center;
    z-index:50; padding:18px;
  }
  .modal{
    width:100%; max-width:520px;
  }
  .modal-body{ padding:18px 18px 20px; }
  .char-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .avatar{
    width:52px; height:52px; border-radius:50%;
    background:var(--teal); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; border:3px solid var(--ink); flex-shrink:0;
  }
  .char-name{ font-weight:700; font-size:14px; }
  .char-role{ font-size:11px; color:#666; }
  .dialogue{
    background:#fff; border:2px solid var(--ink); border-radius:6px;
    padding:12px; font-size:13px; line-height:1.55; margin-bottom:14px;
    position:relative;
  }
  .issue-title{
    font-family:'Alfa Slab One',serif; font-size:15px; color:var(--burgundy);
    margin-bottom:8px;
  }
  .choices{ display:flex; flex-direction:column; gap:8px; }
  .choice-btn{
    text-align:left;
    font-family:'Space Mono',monospace;
    font-size:12.5px;
    padding:10px 12px;
    background:var(--wall);
    border:2px solid var(--ink);
    border-radius:4px;
    cursor:pointer;
  }
  .choice-btn:hover{ background:var(--mustard); }
  .feedback{
    margin-top:10px; padding:10px 12px; border-radius:4px; font-size:12.5px; line-height:1.5;
    border:2px solid var(--ink);
  }
  .feedback.correct{ background:#e6f2e2; color:var(--good); }
  .feedback.wrong{ background:#f6e3e0; color:var(--danger); }
  .modal-actions{ margin-top:12px; text-align:right; }

  .sticky{
    font-family:'Caveat',cursive;
    background:#fff6a8;
    display:inline-block;
    padding:2px 6px;
    transform:rotate(-2deg);
    border:1px solid #d8cf6a;
  }

  /* ---------- ENDING ---------- */
  .ending{ text-align:center; padding:40px 24px; }
  .certificate{
    background:var(--paper);
    border:6px double var(--burgundy);
    padding:26px 20px;
    margin:20px auto;
    max-width:480px;
  }
  .certificate h2{ color:var(--burgundy); font-size:22px; margin-bottom:6px;}
  .certificate .line{ margin:14px 0; font-size:13px; }
  .recap{ text-align:left; max-width:520px; margin:18px auto 0; font-size:12px; }
  .recap ul{ padding-left:18px; line-height:1.7; }

  .footer-note{ text-align:center; color:#8a8aa0; font-size:11px; margin-top:14px; }

  @media (max-width:560px){
    .room{ height:360px; }
    .marquee h1{ font-size:26px; }
  }
  
  /* Registration Options Styling */
  .reg-options {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .reg-tab {
    flex: 1;
    padding: 8px;
    background: var(--wall);
    border: 2px solid var(--ink);
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    font-size: 11px;
    transition: all 0.15s ease;
  }
  .reg-tab.active {
    background: var(--mustard);
    box-shadow: 2px 2px 0 var(--ink);
    transform: translate(-1px, -1px);
  }
  .reg-panel {
    display: none;
  }
  .reg-panel.active {
    display: block;
  }
  .select-input {
    width: 100%;
    padding: 10px;
    margin-bottom: 16px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    font-family: 'Space Mono';
    font-size: 14px;
    background: #fff;
  }

  /* ---------- SCOREBOARD STYLE ---------- */
  .scoreboard-container {
    margin: 24px auto 0;
    max-width: 600px;
    background: var(--wall);
    border: 2px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .scoreboard-header {
    background: var(--teal-dark);
    color: var(--paper);
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--ink);
  }
  .scoreboard-tabs {
    display: flex;
    border-bottom: 2px solid var(--ink);
    background: var(--wall-dark);
  }
  .scoreboard-tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    cursor: pointer;
    font-weight: bold;
    font-size: 11px;
    letter-spacing: 1px;
    transition: background 0.15s ease;
  }
  .scoreboard-tab.active {
    background: var(--mustard);
    color: var(--navy);
  }
  .scoreboard-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    background: #fff;
  }
  .scoreboard-table th {
    background: var(--paper);
    padding: 8px;
    text-align: left;
    border-bottom: 2px solid var(--ink);
    font-size: 11px;
  }
  .scoreboard-table td {
    padding: 8px;
    border-bottom: 1px solid var(--wall);
  }
  .scoreboard-table tr:nth-child(even) {
    background: var(--paper);
  }
  .rank-badge {
    display: inline-block;
    width: 20px;
    height: 20px;
    line-height: 20px;
    text-align: center;
    border-radius: 50%;
    font-weight: bold;
    font-size: 11px;
    border: 1px solid var(--ink);
  }
  .rank-1 { background: var(--mustard); color: var(--navy); }
  .rank-2 { background: #e0e0e0; color: #111; }
  .rank-3 { background: #cd7f32; color: #fff; }

  /* ---------- SPOT THE PHISH STYLE ---------- */
  .exhibits {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .exhibit {
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .exhibit.pickable {
    cursor: pointer;
  }
  .exhibit.pickable:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--ink);
    border-color: var(--teal);
  }
  .exhibit-tag {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 5;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    background: var(--ink);
    color: var(--paper);
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .stamp {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 6;
    font-family: 'Alfa Slab One', serif;
    font-size: 14px;
    padding: 4px 10px;
    border: 3px solid;
    border-radius: 4px;
    transform: rotate(6deg) scale(1.5);
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    text-transform: uppercase;
  }
  .revealed .stamp { opacity: 1; transform: rotate(6deg) scale(1); }
  .stamp.phish { color: var(--danger); border-color: var(--danger); background: rgba(178,59,59,0.1); }
  .stamp.legit { color: var(--good); border-color: var(--good); background: rgba(63,122,77,0.1); transform: rotate(-5deg) scale(1.5); }
  .revealed .stamp.legit { transform: rotate(-5deg) scale(1); }

  /* mail chrome */
  .mail { font-size: 13.5px; font-family: Arial, sans-serif; }
  .mail-head { padding: 14px 16px 12px; border-bottom: 1px solid #ccc; background: #f9f9f9; }
  .mail-row { display: flex; gap: 8px; margin-bottom: 4px; align-items: baseline; }
  .mail-row .k { color: #666; width: 44px; flex: none; font-size: 11px; text-transform: uppercase; font-family: 'Space Mono', monospace; }
  .mail-row .v { font-family: 'Space Mono', monospace; font-size: 12px; word-break: break-word; color:#333; }
  .mail-subject { font-weight: bold; font-size: 14.5px; margin-top: 8px; color:#111; }
  .mail-body { padding: 16px; line-height: 1.6; color: #333; min-height: 150px; }
  .mail-body p { margin: 0 0 12px; }
  .mail-sig { color: #555; font-size: 12.5px; margin-top: 4px; }
  .mail-footer { padding: 10px 16px; border-top: 1px solid #ccc; font-size: 11px; color: #777; background: #f1f1f1; }
  .cta-btn {
    display: inline-block; margin: 6px 0 10px; padding: 9px 18px; border-radius: 4px;
    font-weight: bold; font-size: 13px; text-decoration: none; cursor: pointer; border: none; font-family: inherit;
  }
  .cta-btn.calm { background: #e0e0e0; border: 1px solid #999; color: #333; }
  .cta-btn.urgent { background: var(--danger); color: #fff; }
  .logo-chip {
    display: inline-flex; align-items: center; gap: 6px; font-family: 'Alfa Slab One', serif;
    font-size: 13px; padding: 4px 4px 10px 0; color:#111;
  }
  .logo-chip .mark {
    width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center;
    justify-content: center; font-size: 11px; color: #fff; font-family:'Space Mono', monospace;
  }

  /* browser chrome */
  .browser-bar {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #e1e1e1;
    border-bottom: 2px solid var(--ink);
  }
  .browser-dots { display: flex; gap: 5px; }
  .browser-dots span { width: 8px; height: 8px; border-radius: 50%; background: #999; }
  .addr {

  .banner.bad { background: #f6e3e0; color: var(--danger); }

/* ============ GAME DATA ============ */
const FLOORS = [
  {
    id:1, name:"Reception", tag:"Floor 1 — Threshold of Trust",
    accent:"teal",
    hotspots:[
      {
        id:"f1a", x:"18%", y:"46%", icon:"",
        title:"The Password on Display",
        char:"Debbie", role:"Front Desk", avatar:"ID",
        dialogue:"Debbie beams at the camera. \"Oh, that? That's just my password so I don't forget it! Anyone who needs the Wi-Fi just... looks at the monitor.\"",
        choices:[
          {text:"Remove the sticky note, shred it, and set Debbie up with a password manager.", correct:true,
           feedback:"Correct. Written passwords in plain sight can be read (or photographed) by any visitor. A password manager keeps strong, unique passwords without the sticky notes."},
          {text:"Turn the sticky note face-down so it's more discreet.", correct:false,
           feedback:"Not quite — it's still there for anyone who flips it over, including the next visitor who 'just needs to check something.'"},
          {text:"Leave it — everyone in the office already knows it anyway.", correct:false,
           feedback:"That's exactly the problem — 'everyone knows it' includes visitors, delivery drivers, and anyone glancing at the desk."}
        ]
      },
      {
        id:"f1b", x:"55%", y:"40%", icon:"",
        title:"The Unattended Screen",
        char:"Debbie", role:"Front Desk", avatar:"ID",
        dialogue:"Debbie steps away for coffee. Her screen sits wide open — email, the visitor log, everything — for anyone walking past the desk.",
        choices:[
          {text:"Lock the screen (Win+L / ⌘+Ctrl+Q) every time you step away, even for a minute.", correct:true,
           feedback:"Correct. An unlocked, unattended computer is an open door — literally, at a front desk. Locking it takes two seconds and closes that gap."},
          {text:"It's fine, she's only gone for a minute.", correct:false,
           feedback:"A minute is plenty of time to plug in a USB drive or copy a file. 'Just a minute' is how most walk-by incidents happen."},
          {text:"Angle the monitor so it's harder to see from the lobby.", correct:false,
           feedback:"Better sightlines help, but the screen is still unlocked and usable by anyone who reaches the keyboard."}
        ]
      },
      {
        id:"f1c", x:"84%", y:"50%", icon:"",
        title:"The Friendly Tailgater",
        char:"Marcus", role:"Delivery Guest", avatar:"ID",
        dialogue:"A man in a delivery vest smiles and slips through the badge door right behind an employee. \"Don't worry, I'm quick — I know where I'm going!\"",
        choices:[
          {text:"Stop him at the door, verify who he's visiting, and sign him in as a guest.", correct:true,
           feedback:"Correct. This is 'tailgating' — following an authorized person through a secure door. Every visitor should be verified and signed in, no exceptions for a friendly face."},
          {text:"Hold the door open for him — he seems nice.", correct:false,
           feedback:"Being nice is how tailgating works. Badge doors only protect the building if only badge-holders (and verified guests) go through them."},
          {text:"Ignore it, he's probably fine.", correct:false,
           feedback:"'Probably fine' isn't a security policy. Unverified people inside the building can access desks, screens, and paperwork."}
        ]
      }
    ]
  },
  {
    id:2, name:"Sales Department", tag:"Floor 2 — The Click Heard Round the Office",
    accent:"burgundy",
    hotspots:[
      {
        id:"f2a", x:"20%", y:"38%", icon:"",
        title:"The Urgent Package Email",
        char:"Gary", role:"Account Executive", avatar:"ID",
        dialogue:"Gary's cursor hovers over a subject line: \"URGENT: Your package is delayed — click to reschedule.\" \"I don't even remember ordering anything, but it says urgent!\"",
        choices:[
          {text:"Hover over the link to check the real address, then report it as phishing instead of clicking.", correct:true,
           feedback:"Correct. Urgency plus an unexpected link is a classic phishing pattern. Checking the real link and reporting it stops the trap before it opens."},
          {text:"Click it — better safe than sorry about a missed package.", correct:false,
           feedback:"That's exactly the panic phishing emails are designed to create. Clicking can install malware or steal login credentials."},
          {text:"Forward it to a coworker to ask if it's real.", correct:false,
           feedback:"Better than clicking, but it still spreads the risky link around and delays reporting it. Report to IT/security directly instead."}
        ]
      },
      {
        id:"f2b", x:"52%", y:"44%", icon:"",
        title:"The Mystery USB Drive",
        char:"Priya", role:"Sales Rep", avatar:"ID",
        dialogue:"Priya found a USB drive in the parking lot labeled \"Bonus Payroll List 2026.\" \"I mean... it basically has my name on it, right?\"",
        choices:[
          {text:"Don't plug it in — hand it to IT so they can check it safely.", correct:true,
           feedback:"Correct. Unknown USB drives are a well-known way to deliver malware. A tempting label ('Bonus', 'Confidential') is the bait, not a reason to trust it."},
          {text:"Plug it in just to peek at the filenames.", correct:false,
           feedback:"Even opening it can trigger malicious code automatically. 'Just a peek' is all it takes."},
          {text:"Leave it on your desk for now and deal with it later.", correct:false,
           feedback:"An unknown device sitting around is still a risk — and easy to forget about. Hand it to IT right away."}
        ]
      },
      {
        id:"f2c", x:"82%", y:"40%", icon:"",
        title:"Client Data Over Café Wi-Fi",
        char:"Tom", role:"Sales Rep (remote)", avatar:"ID",
        dialogue:"Tom is entering a client's credit card details into a form, laptop balanced on a café table, connected to \"Free_Airport_WiFi.\" \"It's free Wi-Fi, that's basically the same as ours.\"",
        choices:[
          {text:"Connect through the company VPN before handling any client or payment data.", correct:true,
           feedback:"Correct. Public Wi-Fi can be intercepted or spoofed. A VPN encrypts the connection so sensitive data isn't exposed to everyone on the network."},
          {text:"It's fine — the form has a lock icon in the browser.", correct:false,
           feedback:"HTTPS protects the connection to that one site, but it doesn't protect the network itself or stop a rogue hotspot from watching traffic."},
          {text:"Keep working — he'll just be quick about it.", correct:false,
           feedback:"Speed doesn't reduce the risk. Sensitive data shouldn't touch an untrusted network at all without a VPN."}
        ]
      }
    ]
  },
  {
    id:3, name:"Human Resources", tag:"Floor 3 — Confidential... Ish",

    hotspots:[

        choices:[
          {text:"Lock the cabinet now, and shred documents that are no longer needed.", correct:true,

        choices:[

          {text:"Give him the SSN — sounding official is good enough.", correct:false,

        ]
      }
    ]
  }

let state = {
  screen:"hub", // hub | title | registration | lobby | floor | ending | phish | phishRegistration | phishEnding
  currentFloor:1,
  resolved:{}, // hotspotId: true (indicates answered)
  answers:{},  // hotspotId: { correct: boolean, choiceText: string, feedback: string }
  teamKey: null,
  isSolo: true,
  teamName: "",
  
  // Spot the Phish state
  phishLevel: 0,
  phishPhase: "choose", // choose | revealed
  phishChosenSide: null,
  phishScore: 0,
  phishTeamKey: null,
  phishIsSolo: true,
  phishTeamName: ""
};

function totalHotspots(){ return FLOORS.reduce((n,f)=>n+f.hotspots.length,0); }
function resolvedCount(){ return Object.keys(state.resolved).length; }
function floorResolvedCount(floor){ return floor.hotspots.filter(h=>state.resolved[h.id]).length; }
function isFloorCleared(floor){ return floorResolvedCount(floor)===floor.hotspots.length; }
function isFloorUnlocked(floorIdx){
  if(floorIdx===0) return true;
  return isFloorCleared(FLOORS[floorIdx-1]);
}

/* ============ SCOREBOARD HELPER ============ */
function renderScoreboard(target) {
  const container = typeof target === 'string' ? document.getElementById(target) : target;
  if (!container) return;

  container.innerHTML = `
    <div class="scoreboard-container">
      <div class="scoreboard-header">
        <span style="font-family:'Alfa Slab One'; font-size:12px; letter-spacing:1px;">LEADERBOARD</span>
        <span style="font-size:9px; opacity:0.8;">TOP INSPECTORS</span>
      </div>
      <div class="scoreboard-tabs">
        <div class="scoreboard-tab active" id="sbTabTeams">TEAMS</div>
        <div class="scoreboard-tab" id="sbTabSolo">SOLO AGENTS</div>
      </div>
      <div id="scoreboardList" style="max-height: 220px; overflow-y: auto; background:#fff;">
        <div style="padding: 16px; text-align: center; font-style: italic; color:#666;">Loading scores...</div>
      </div>
    </div>
  `;

  const listEl = container.querySelector('#scoreboardList');
  const tabTeams = container.querySelector('#sbTabTeams');
  const tabSolo = container.querySelector('#sbTabSolo');

  let currentTab = 'teams'; 
  let allEntries = [];

  // Load from local storage cache first
  try {
    const cached = localStorage.getItem('cachedScoreboard');
    if (cached) {
      allEntries = JSON.parse(cached);
    }
    const localRuns = JSON.parse(localStorage.getItem('localRuns') || '[]');
    localRuns.forEach(run => {
      if (!allEntries.some(e => e.timestamp === run.timestamp && e.score === run.score)) {
        allEntries.push(run);
      }
    });
  } catch (e) {
    console.error("Local storage error:", e);
  }

  function updateList() {
    if (allEntries.length === 0) {
      listEl.innerHTML = `<div style="padding: 16px; text-align: center; font-style: italic; color:#666; font-size:11px;">No completed runs recorded.</div>`;
      return;
    }

    const filtered = allEntries.filter(entry => {
      const isSoloEntry = !!entry.isSolo || (entry.teamName && entry.teamName.includes('(Solo)'));
      return currentTab === 'solo' ? isSoloEntry : !isSoloEntry;
    });

    filtered.sort((a, b) => {
      const scoreA = typeof a.score === 'number' ? a.score : 0;
      const scoreB = typeof b.score === 'number' ? b.score : 0;
      if (scoreB !== scoreA) return scoreB - scoreA;
      return new Date(a.timestamp || 0) - new Date(b.timestamp || 0);
    });

    if (filtered.length === 0) {
      listEl.innerHTML = `<div style="padding: 16px; text-align: center; font-style: italic; color:#666; font-size:11px;">No entries for this category yet.</div>`;
      return;
    }

    let html = `
      <table class="scoreboard-table">
        <thead>
          <tr>
            <th style="width:40px; text-align:center;">Rank</th>
            <th>Name</th>
            <th>Members</th>
            <th style="width:65px; text-align:right;">Score</th>
          </tr>
        </thead>
        <tbody>
    `;

    filtered.slice(0, 10).forEach((entry, idx) => {
      const score = typeof entry.score === 'number' ? entry.score : 0;
      const name = entry.teamName || "Unnamed Team";
      const members = entry.teamMembers || "Anonymous";
      const rankClass = idx < 3 ? `rank-${idx+1}` : '';
      
      html += `
        <tr>
          <td style="text-align:center;"><span class="rank-badge ${rankClass}">${idx+1}</span></td>
          <td style="font-weight:bold;">${name}</td>
          <td style="color:#555; font-size:11px;">${members}</td>
          <td style="text-align:right; font-weight:bold; color:var(--burgundy);">${score}/15</td>
        </tr>
      `;
    });

    html += `
        </tbody>
      </table>
    `;
    listEl.innerHTML = html;
  }

  tabTeams.onclick = () => {
    currentTab = 'teams';
    tabTeams.classList.add('active');
    tabSolo.classList.remove('active');
    updateList();
  };

  tabSolo.onclick = () => {
    currentTab = 'solo';
    tabSolo.classList.add('active');
    tabTeams.classList.remove('active');
    updateList();
  };

  updateList();

  if (window.db && window.firebaseGet && window.firebaseRef) {
    window.firebaseGet(window.firebaseRef(window.db, 'teams'))
      .then(snapshot => {
        if (snapshot.exists()) {
          const val = snapshot.val();
          const remoteEntries = Object.keys(val).map(key => ({
            id: key,
            ...val[key]
          })).filter(entry => entry.score !== undefined); 
          
          try {
            localStorage.setItem('cachedScoreboard', JSON.stringify(remoteEntries));
          } catch(e) {}
          
          allEntries = [...remoteEntries];
          try {
            const localRuns = JSON.parse(localStorage.getItem('localRuns') || '[]');
            localRuns.forEach(run => {
              if (!allEntries.some(e => e.timestamp === run.timestamp && e.score === run.score)) {
                allEntries.push(run);
              }
            });
          } catch (e) {}
          
          updateList();
        } else {
          if (allEntries.length === 0) {
            listEl.innerHTML = `<div style="padding: 16px; text-align: center; font-style: italic; color:#666; font-size:11px;">No completed runs recorded yet.</div>`;
          }
        }
      })
      .catch(err => {
        if (allEntries.length === 0) {
          listEl.innerHTML = `<div style="padding: 16px; text-align: center; color:var(--danger); font-size:11px;">Error loading scores: ${err.message}</div>`;
        }
      });
  } else {
    if (allEntries.length === 0) {
      listEl.innerHTML = `<div style="padding: 16px; text-align: center; font-style: italic; color:#666; font-size:11px;">Database offline.</div>`;
    }
  }
}

/* ============ RENDER ============ */
const stage = document.getElementById('stage');

function render(){
  stage.innerHTML = "";
  if(state.screen==="hub") stage.appendChild(renderHub());
  else if(state.screen==="title") stage.appendChild(renderTitle());
  else if(state.screen==="registration") stage.appendChild(renderRegistration());
  else if(state.screen==="lobby") stage.appendChild(renderLobby());
  else if(state.screen==="floor") stage.appendChild(renderFloor());
  else if(state.screen==="ending") stage.appendChild(renderEnding());
  else if(state.screen==="phish") stage.appendChild(renderPhish());
  else if(state.screen==="phishRegistration") stage.appendChild(renderPhishRegistration());
  else if(state.screen==="phishEnding") stage.appendChild(renderPhishEnding());
}

function el(html){
  const d=document.createElement('div');
  d.innerHTML=html.trim();
  return d.firstElementChild;
}

function renderRegistration(){
  const wrap = el(`
    <div class="crt-frame">
      <div class="crt-inner">
        <div class="rec-tag"><span class="rec-dot"></span>REC</div>
        <div class="marquee">
          <h1>Registration</h1>
          <div class="sub">CHOOSE YOUR INSPECTION MODE</div>

              <input type="checkbox" id="soloAnon" style="width:16px; height:16px; accent-color:var(--mustard);">

            </label>

            <div style="text-align:center;">
              <button class="btn" id="startSoloBtn">Start Solo Inspection</button>
            </div>
          </div>

          <!-- JOIN TEAM PANEL -->
          <div class="reg-panel" id="panelJoin">
            <div id="joinLoading" style="font-size:13px; margin-bottom:16px; font-style:italic; color:#555;">
              Connecting to database & loading active teams...
            </div>
            
            <div id="joinContent" style="display:none;">
              <label style="display:block; font-weight:bold; margin-bottom:8px; font-size:14px;">Select Team</label>
              <select id="joinTeamSelect" class="select-input"></select>

              <div id="teamMembersPreview" style="font-size:12px; background:var(--wall); border:1px dashed var(--ink); padding:8px 12px; margin-bottom:16px; border-radius:4px;">
                <strong>Current members:</strong> <span id="membersList">None</span>
              </div>
              
              <label style="display:block; font-weight:bold; margin-bottom:8px; font-size:14px;">Your Name</label>
              <input type="text" id="joinName" placeholder="e.g. Alice" style="width:100%; padding:10px; margin-bottom:24px; border:2px solid var(--ink); border-radius:4px; font-family:'Space Mono'; font-size:14px;">
              
              <div style="text-align:center;">
                <button class="btn" id="submitJoinBtn">Join & Enter Lobby</button>
              </div>
            </div>
          </div>

          <!-- CREATE TEAM PANEL -->
          <div class="reg-panel" id="panelCreate">
            <label style="display:block; font-weight:bold; margin-bottom:8px; font-size:14px;">Team Name</label>
            <input type="text" id="teamName" placeholder="e.g. The Cyber Sleuths" style="width:100%; padding:10px; margin-bottom:16px; border:2px solid var(--ink); border-radius:4px; font-family:'Space Mono'; font-size:14px;">
            
            <label style="display:block; font-weight:bold; margin-bottom:8px; font-size:14px;">Team Members (comma separated)</label>
            <input type="text" id="teamMembers" placeholder="e.g. Alice, Bob, Charlie" style="width:100%; padding:10px; margin-bottom:24px; border:2px solid var(--ink); border-radius:4px; font-family:'Space Mono'; font-size:14px;">

          </div>

      </div>
    </div>
  `);

  // Tab switching logic
  const tabs = {
    Solo: { tab: wrap.querySelector('#tabSolo'), panel: wrap.querySelector('#panelSolo') },
    Join: { tab: wrap.querySelector('#tabJoin'), panel: wrap.querySelector('#panelJoin') },
    Create: { tab: wrap.querySelector('#tabCreate'), panel: wrap.querySelector('#panelCreate') }
  };

  let activeTeams = {}; // key: team push ID, value: team object

  function switchTab(targetKey) {
    Object.keys(tabs).forEach(key => {
      if (key === targetKey) {
        tabs[key].tab.classList.add('active');
        tabs[key].panel.classList.add('active');
      } else {
        tabs[key].tab.classList.remove('active');
        tabs[key].panel.classList.remove('active');
      }
    });

    if (targetKey === 'Join') {
      loadTeams();
    }
  }

  tabs.Solo.tab.onclick = () => switchTab('Solo');
  tabs.Join.tab.onclick = () => switchTab('Join');
  tabs.Create.tab.onclick = () => switchTab('Create');

  // Load active teams from Firebase
  function loadTeams() {
    const loadingDiv = wrap.querySelector('#joinLoading');
    const contentDiv = wrap.querySelector('#joinContent');
    const selectEl = wrap.querySelector('#joinTeamSelect');
    const membersSpan = wrap.querySelector('#membersList');

    if (!window.db || !window.firebaseGet || !window.firebaseRef) {
      loadingDiv.textContent = "Database connection offline. You can still play Solo or New Team offline.";
      return;
    }

    loadingDiv.textContent = "Connecting to database & loading active teams...";
    loadingDiv.style.display = "block";
    contentDiv.style.display = "none";

    window.firebaseGet(window.firebaseRef(window.db, 'teams'))
      .then(snapshot => {
        if (snapshot.exists()) {
          activeTeams = snapshot.val();
          selectEl.innerHTML = "";
          
          Object.keys(activeTeams).forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = activeTeams[key].teamName || "Unnamed Team";
            selectEl.appendChild(opt);
          });

          const firstKey = Object.keys(activeTeams)[0];
          if (firstKey) {
            membersSpan.textContent = activeTeams[firstKey].teamMembers || "No members listed";
          }

          loadingDiv.style.display = "none";
          contentDiv.style.display = "block";
        } else {
          loadingDiv.textContent = "No active teams found. Create a new team first!";
        }
      })
      .catch(err => {
        loadingDiv.textContent = "Failed to load teams: " + err.message;
      });
  }

  wrap.querySelector('#joinTeamSelect').onchange = (e) => {
    const selectedKey = e.target.value;
    const membersSpan = wrap.querySelector('#membersList');
    if (activeTeams[selectedKey]) {
      membersSpan.textContent = activeTeams[selectedKey].teamMembers || "No members listed";
    }
  };

  // Solo start logic
  wrap.querySelector('#startSoloBtn').onclick = () => {
    const sName = wrap.querySelector('#soloName').value.trim();

    if (!isAnon && sName) {
      const btn = wrap.querySelector('#startSoloBtn');
      btn.disabled = true;
      btn.textContent = "Starting...";

      if (window.db && window.firebasePush && window.firebaseRef && window.firebaseSet) {
        const teamsRef = window.firebasePush(window.firebaseRef(window.db, 'teams'));
        state.teamKey = teamsRef.key;
        state.isSolo = true;
        state.teamName = `${sName} (Solo)`;
        window.firebaseSet(teamsRef, {
          teamName: `${sName} (Solo)`,
          teamMembers: sName,
          timestamp: new Date().toISOString(),
          isSolo: true
        }).then(() => {
          state.screen = "lobby";
          render();
        }).catch(err => {
          console.error("Error saving solo run:", err);
          state.screen = "lobby";
          render();
        });
      } else {
        state.screen = "lobby";
        render();
      }
    } else {
      state.screen = "lobby";
      state.teamKey = null;
      state.isSolo = true;
      state.teamName = sName ? `${sName} (Solo)` : "Anonymous Solo";
      render();
    }
  };

  // Join existing team submit logic
  wrap.querySelector('#submitJoinBtn').onclick = () => {
    const selectedKey = wrap.querySelector('#joinTeamSelect').value;
    const newMember = wrap.querySelector('#joinName').value.trim();

    if (!newMember) {
      alert("Please enter your name to join the team.");
      return;
    }

    if (!selectedKey || !activeTeams[selectedKey]) {
      alert("Please select a valid team.");
      return;
    }

    const btn = wrap.querySelector('#submitJoinBtn');
    btn.disabled = true;
    btn.textContent = "Joining...";

    const currentMembers = activeTeams[selectedKey].teamMembers || "";
    const updatedMembers = currentMembers ? `${currentMembers}, ${newMember}` : newMember;

    state.teamKey = selectedKey;
    state.isSolo = false;
    state.teamName = activeTeams[selectedKey].teamName || "Unnamed Team";

    if (window.db && window.firebaseRef && window.firebaseUpdate) {
      const teamRef = window.firebaseRef(window.db, `teams/${selectedKey}`);
      window.firebaseUpdate(teamRef, {
        teamMembers: updatedMembers
      }).then(() => {
        state.screen = "lobby";
        render();
      }).catch(err => {
        alert("Error joining team: " + err.message);
        btn.disabled = false;
        btn.textContent = "Join & Enter Lobby";
      });
    } else {
      state.screen = "lobby";
      render();
    }
  };

  // New team submit logic
  wrap.querySelector('#submitTeamBtn').onclick = () => {
    const tName = wrap.querySelector('#teamName').value.trim();
    const tMembers = wrap.querySelector('#teamMembers').value.trim();
    
    if(!tName || !tMembers) {
      alert("Please enter both a team name and team members.");
      return;
    }
    
    const btn = wrap.querySelector('#submitTeamBtn');
    btn.disabled = true;
    btn.textContent = "Registering...";

    if(window.db && window.firebasePush && window.firebaseRef && window.firebaseSet) {
      const teamsRef = window.firebasePush(window.firebaseRef(window.db, 'teams'));
      state.teamKey = teamsRef.key;
      state.isSolo = false;
      state.teamName = tName;
      window.firebaseSet(teamsRef, {
        teamName: tName,
        teamMembers: tMembers,
        timestamp: new Date().toISOString(),
        isSolo: false
      }).then(() => {
        state.screen="lobby"; 
        render();
      }).catch(err => {
        alert("Error saving team: " + err.message);
        btn.disabled = false;
        btn.textContent = "Register & Enter Lobby";
      });
    } else {
      state.screen="lobby";
      render();
    }
  };

  wrap.querySelector('#backToHubFromReg').onclick = ()=>{ state.screen="hub"; render(); };

  return wrap;
}

function openInvestigation(floor, hotspot){
  const overlay = el(`<div class="modal-overlay"></div>`);
  const modal = el(`
    <div class="modal crt-frame">
      <div class="crt-inner">
        <div class="rec-tag"><span class="rec-dot"></span>REC</div>
        <div class="modal-body">
          <div class="issue-title">${hotspot.title}</div>
          <div class="char-row">
            <div class="avatar">${hotspot.avatar}</div>
            <div>
              <div class="char-name">${hotspot.char}</div>
              <div class="char-role">${hotspot.role}</div>
            </div>
          </div>
          <div class="dialogue">${hotspot.dialogue}</div>
          <div class="choices" id="choicesWrap"></div>
          <div id="feedbackWrap"></div>
          <div class="modal-actions" id="actionsWrap"></div>
        </div>
        <div class="timestamp">CASE FILE — ${floor.name.toUpperCase()}</div>
      </div>
    </div>
  `);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  const choicesWrap = modal.querySelector('#choicesWrap');
  const feedbackWrap = modal.querySelector('#feedbackWrap');
  const actionsWrap = modal.querySelector('#actionsWrap');

  function showChoices(){
    choicesWrap.innerHTML = "";
    feedbackWrap.innerHTML = "";
    actionsWrap.innerHTML = "";
    const shuffledChoices = [...hotspot.choices].sort(() => Math.random() - 0.5);
    shuffledChoices.forEach(choice=>{
      const cbtn = el(`<button class="choice-btn">${choice.text}</button>`);
      cbtn.onclick = ()=>{
        choicesWrap.innerHTML = "";
        
        // Record answer
        state.answers[hotspot.id] = {
          correct: choice.correct,
          choiceText: choice.text,
          feedback: choice.feedback,
          title: hotspot.title
        };
        state.resolved[hotspot.id] = true;

        feedbackWrap.innerHTML = `<div class="feedback" style="background:var(--wall); color:var(--ink); border-color:var(--ink);">✔ Investigation response recorded in case files. Results will be shown on the final audit report.</div>`;
        
        actionsWrap.innerHTML = "";
        const doneBtn = el(`<button class="btn small">Close Case File</button>`);
        doneBtn.onclick = ()=>{ document.body.removeChild(overlay); render(); };
        actionsWrap.appendChild(doneBtn);
      };
      choicesWrap.appendChild(cbtn);
    });
  }
  showChoices();

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ document.body.removeChild(overlay); render(); } });
}

function renderEnding(){
  const correctCount = Object.values(state.answers).filter(a=>a.correct).length;
  
  // Save run to local runs history
  try {
    const localRuns = JSON.parse(localStorage.getItem('localRuns') || '[]');
    const newRun = {
      teamName: state.teamName || 'The Inspector',
      teamMembers: state.isSolo ? (state.teamName || 'The Inspector') : (state.teamName || 'The Inspector'),
      score: correctCount,
      completed: true,
      timestamp: new Date().toISOString(),
      isSolo: state.isSolo
    };
    // Avoid duplicates by checking timestamp/name
    if (!localRuns.some(r => r.timestamp === newRun.timestamp && r.teamName === newRun.teamName)) {
      localRuns.push(newRun);
      localStorage.setItem('localRuns', JSON.stringify(localRuns));
    }
  } catch (e) {
    console.error("Error saving run locally:", e);
  }

  if(window.db && window.firebaseRef && window.firebaseUpdate && state.teamKey) {
    const teamRef = window.firebaseRef(window.db, `teams/${state.teamKey}`);

      completed: true,
      timestamp: new Date().toISOString()
    }).catch(err => console.error("Error saving score:", err));
  }

  const wrap = el(`
    <div class="crt-frame">
      <div class="crt-inner">
        <div class="rec-tag"><span class="rec-dot"></span>REC</div>

            <h3 style="font-size:14px; margin-bottom:12px; border-bottom: 2px solid var(--ink); padding-bottom: 4px;">Detailed Audit Results:</h3>
            ${FLOORS.map(f=>`
              <div style="margin-bottom:16px; background: rgba(0,0,0,0.02); padding: 10px; border-radius: 4px; border: 2px solid var(--ink);">
                <b style="color:var(--teal-dark); font-size:13px;">${f.name}</b>
                <div style="margin-top:8px; display:flex; flex-direction:column; gap:10px;">
                  ${f.hotspots.map(h=>{
                    const ans = state.answers[h.id] || { correct: false, choiceText: "No answer recorded", feedback: "N/A" };
                    const statusClass = ans.correct ? 'correct' : 'wrong';
                    const statusSymbol = ans.correct ? '✔' : '✘';
                    return `
                      <div style="font-size:12px; border-left: 4px solid ${ans.correct ? 'var(--good)' : 'var(--danger)'}; padding-left: 8px;">
                        <div style="font-weight:bold; display:flex; justify-content:space-between;">
                          <span>${h.title}</span>
                          <span style="color:${ans.correct?'var(--good)':'var(--danger)'}; font-weight:bold;">${statusSymbol} ${ans.correct?'Correct':'Incorrect'}</span>
                        </div>

                        <div class="feedback ${statusClass}" style="margin-top:2px; padding:8px; font-size:11.5px; border-radius:3px;">
                          ${ans.feedback}
                        </div>
                      </div>
                    `;

    render();
  };

  renderScoreboard(wrap.querySelector('#endingScoreboard'));
  return wrap;
}



function renderPhishScoreboard(target) {
  const container = typeof target === 'string' ? document.getElementById(target) : target;
  if (!container) return;

  container.innerHTML = `
    <div class="scoreboard-container">
      <div class="scoreboard-header">
        <span style="font-family:'Alfa Slab One'; font-size:12px; letter-spacing:1px;">LEADERBOARD — SPOT THE PHISH</span>
        <span style="font-size:9px; opacity:0.8;">TOP PHISH HUNTERS</span>
      </div>
      <div id="phishScoreboardList" style="max-height: 220px; overflow-y: auto; background:#fff;">
        <div style="padding: 16px; text-align: center; font-style: italic; color:#666;">Loading scores...</div>
      </div>
    </div>
  `;

  const listEl = container.querySelector('#phishScoreboardList');

  function showEntries(entries) {
    if(!entries || entries.length === 0) {
      listEl.innerHTML = `<div style="padding:16px; text-align:center; font-style:italic; color:#666; font-size:11px;">No completed runs yet.</div>`;
      return;
    }
    const sorted = [...entries].filter(e => e.phishScore !== undefined).sort((a,b) => (b.phishScore||0) - (a.phishScore||0)).slice(0,10);
    if(sorted.length === 0) {
      listEl.innerHTML = `<div style="padding:16px; text-align:center; font-style:italic; color:#666; font-size:11px;">No completed runs yet.</div>`;
      return;
    }
    let html = `<table class="scoreboard-table"><thead><tr>
      <th style="width:40px;text-align:center;">Rank</th>
      <th>Name</th>
      <th style="width:70px;text-align:right;">Score</th>
    </tr></thead><tbody>`;
    sorted.forEach((entry, idx) => {
      const rankClass = idx < 3 ? `rank-${idx+1}` : '';
      html += `<tr><td style="text-align:center;"><span class="rank-badge ${rankClass}">${idx+1}</span></td>
        <td style="font-weight:bold;">${entry.phishTeamName || 'Anonymous'}</td>
        <td style="text-align:right;font-weight:bold;color:var(--teal-dark);">${entry.phishScore}/5</td></tr>`;
    });
    html += '</tbody></table>';
    listEl.innerHTML = html;
  }

  let localEntries = [];
  try {
    localEntries = JSON.parse(localStorage.getItem('phishRuns') || '[]');
    showEntries(localEntries);
  } catch(e) {}

  if(window.db && window.firebaseGet && window.firebaseRef) {
    window.firebaseGet(window.firebaseRef(window.db, 'phish_teams'))
      .then(snap => {
        if(snap.exists()) {
          const entries = Object.values(snap.val()).filter(e => e.phishScore !== undefined);
          try { localStorage.setItem('phishRuns', JSON.stringify(entries)); } catch(e2) {}
          showEntries(entries);
        } else { showEntries(localEntries); }
      })
      .catch(() => showEntries(localEntries));
  }
}

function renderSecureScoreboard(target) {
  const container = typeof target === 'string' ? document.getElementById(target) : target;
  if (!container) return;
  container.innerHTML = '<div class="scoreboard-container"><div class="scoreboard-header"><span style="font-family:\'Alfa Slab One\';font-size:12px;letter-spacing:1px;">LEADERBOARD — MAKE ME SECURE</span><span style="font-size:9px;opacity:.8;">PASSWORD DEFENDERS</span></div><div id="secureScoreboardList" style="max-height:220px;overflow-y:auto;background:#fff;"></div></div>';
  const list = container.querySelector('#secureScoreboardList');
  const show = entries => {
    const sorted = [...entries].filter(e => e.secureScore !== undefined).sort((a,b) => (b.scorePercent || 0) - (a.scorePercent || 0)).slice(0,10);
    if (!sorted.length) { list.innerHTML = '<div style="padding:16px;text-align:center;font-style:italic;color:#666;font-size:11px;">No completed runs yet.</div>'; return; }
    list.innerHTML = `<table class="scoreboard-table"><thead><tr><th style="width:40px;text-align:center;">Rank</th><th>Name</th><th style="width:70px;text-align:right;">Score</th></tr></thead><tbody>${sorted.map((e,i) => `<tr><td style="text-align:center;"><span class="rank-badge ${i<3?'rank-'+(i+1):''}">${i+1}</span></td><td style="font-weight:bold;">${e.secureTeamName || e.teamName || 'Anonymous'}</td><td style="text-align:right;font-weight:bold;color:var(--mustard-dark);">${e.secureScore}/${e.secureMax}</td></tr>`).join('')}</tbody></table>`;
  };
  let local = []; try { local = JSON.parse(localStorage.getItem('secureRuns') || '[]'); } catch (e) {}
  show(local);
  if (window.db && window.firebaseGet && window.firebaseRef) window.firebaseGet(window.firebaseRef(window.db, 'secure_teams')).then(s => { if (s.exists()) { const remote = Object.values(s.val()); try { localStorage.setItem('secureRuns', JSON.stringify(remote)); } catch (e) {} show(remote); } }).catch(() => {});
}

function renderOverallScoreboard(target) {
  const container = typeof target === 'string' ? document.getElementById(target) : target;
  if (!container) return;
  container.innerHTML = '<div class="scoreboard-container"><div class="scoreboard-header"><span style="font-family:\'Alfa Slab One\';font-size:12px;letter-spacing:1px;">LEADERBOARD — ALL GAMES</span><span style="font-size:9px;opacity:.8;">CYBERWARE HQ RANKING</span></div><div id="overallScoreboardList" style="max-height:260px;overflow-y:auto;background:#fff;"></div></div>';
  const list = container.querySelector('#overallScoreboardList');
  const show = groups => {
    const entries = groups.flat().filter(e => e.name && typeof e.percent === 'number').sort((a,b) => b.percent - a.percent).slice(0,10);
    list.innerHTML = entries.length ? `<table class="scoreboard-table"><thead><tr><th style="width:40px;text-align:center;">Rank</th><th>Name</th><th>Game</th><th style="width:65px;text-align:right;">Score</th></tr></thead><tbody>${entries.map((e,i) => `<tr><td style="text-align:center;"><span class="rank-badge ${i<3?'rank-'+(i+1):''}">${i+1}</span></td><td style="font-weight:bold;">${e.name}</td><td style="font-size:10px;color:#666;">${e.game}</td><td style="text-align:right;font-weight:bold;">${e.percent}%</td></tr>`).join('')}</tbody></table>` : '<div style="padding:16px;text-align:center;font-style:italic;color:#666;font-size:11px;">No completed runs yet.</div>';
  };
  const read = (key, mapper) => { try { return JSON.parse(localStorage.getItem(key) || '[]').map(mapper); } catch (e) { return []; } };
  const refresh = () => show([
    read('localRuns', e => ({name:e.teamName || 'Anonymous', game:'UNSAFE Business', percent:Math.round((e.score || 0) / 15 * 100)})),
    read('phishRuns', e => ({name:e.phishTeamName || 'Anonymous', game:'Spot the Phish', percent:Math.round((e.phishScore || 0) / 5 * 100)})),
    read('secureRuns', e => ({name:e.secureTeamName || e.teamName || 'Anonymous', game:'Make Me Secure', percent:e.scorePercent ?? Math.round((e.secureScore || 0) / (e.secureMax || 1) * 100)}))
  ]);
  refresh();
}

  };
  let activePhishTeams = {};

  function switchPhishTab(key) {
    Object.keys(tabs).forEach(k => {

      tabs[k].panel.classList.toggle('active', k===key);

    if(!anon && name && window.db && window.firebasePush && window.firebaseRef && window.firebaseSet) {
      const btn = wrap.querySelector('#pStartSoloBtn');
      btn.disabled = true; btn.textContent = 'Starting...';
      const ref = window.firebasePush(window.firebaseRef(window.db, 'phish_teams'));
      state.phishTeamKey = ref.key;
      window.firebaseSet(ref, {
        phishTeamName: state.phishTeamName,
        phishMembers: name,
        timestamp: new Date().toISOString(),
        isSolo: true
      }).then(() => startPhishGame()).catch(() => startPhishGame());
    } else {

    }

  wrap.querySelector('#pSubmitJoinBtn').onclick = () => {
    const key = wrap.querySelector('#pJoinSelect').value;
    const name = wrap.querySelector('#pJoinName').value.trim();

    const btn = wrap.querySelector('#pSubmitJoinBtn');
    btn.disabled = true; btn.textContent = 'Joining...';
    state.phishTeamKey = key;
    state.phishIsSolo = false;
    state.phishTeamName = activePhishTeams[key]?.phishTeamName || 'Team';
    if(window.db && window.firebaseRef && window.firebaseUpdate) {
      const cur = activePhishTeams[key]?.phishMembers || '';
      window.firebaseUpdate(window.firebaseRef(window.db, `phish_teams/${key}`), {
        phishMembers: cur ? cur + ', ' + name : name
      }).then(() => startPhishGame()).catch(() => startPhishGame());
    } else { startPhishGame(); }
  };

  wrap.querySelector('#pSubmitTeamBtn').onclick = () => {
    const tName = wrap.querySelector('#pTeamName').value.trim();
    const tMembers = wrap.querySelector('#pTeamMembers').value.trim();
    if(!tName || !tMembers) { alert('Please fill in both fields.'); return; }
    const btn = wrap.querySelector('#pSubmitTeamBtn');
    btn.disabled = true; btn.textContent = 'Registering...';
    state.phishIsSolo = false;
    state.phishTeamName = tName;
    if(window.db && window.firebasePush && window.firebaseRef && window.firebaseSet) {
      const ref = window.firebasePush(window.firebaseRef(window.db, 'phish_teams'));
      state.phishTeamKey = ref.key;
      window.firebaseSet(ref, {
        phishTeamName: tName,
        phishMembers: tMembers,
        timestamp: new Date().toISOString(),
        isSolo: false
      }).then(() => startPhishGame()).catch(err => {
        alert('Error: ' + err.message);
        btn.disabled = false; btn.textContent = 'Register & Start Hunt';
      });
    } else { startPhishGame(); }
  };

  wrap.querySelector('#pBackBtn').onclick = () => { state.screen='hub'; render(); };
  return wrap;
}

function renderPhishEnding(){
  const score = state.phishScore;
  const total = PHISH_LEVELS.length;

  // Save to firebase
  if(window.db && window.firebaseRef && window.firebaseUpdate && state.phishTeamKey) {
    window.firebaseUpdate(window.firebaseRef(window.db, `phish_teams/${state.phishTeamKey}`), {
      phishScore: score,
      completed: true,
      timestamp: new Date().toISOString()
    }).catch(err => console.error('Error saving phish score:', err));
  }
  // Save locally
  try {
    const runs = JSON.parse(localStorage.getItem('phishRuns') || '[]');
    runs.push({ phishTeamName: state.phishTeamName, phishScore: score, timestamp: new Date().toISOString() });
    localStorage.setItem('phishRuns', JSON.stringify(runs));
  } catch(e) {}

  let rank = 'Trainee Analyst';
  const pct = (score / total) * 100;
  if(pct >= 100) rank = 'Senior Threat Analyst';
  else if(pct >= 80) rank = 'Field Investigator';
  else if(pct >= 60) rank = 'Junior Analyst';

  const wrap = el(`
    <div class="crt-frame">
      <div class="crt-inner">
        <div class="rec-tag"><span class="rec-dot"></span>REC</div>
        <div class="marquee">
          <h1 style="font-size:28px;">Phish Hunt Complete</h1>
          <div class="sub">CASE FILE CLOSED — SPOT THE PHISH</div>
        </div>
        <div class="ending">
          <div class="certificate">
            <h2>Certificate of Phishing Awareness</h2>
            <div class="line">Awarded to <b>${state.phishTeamName || 'The Inspector'}</b></div>
            <div class="line" style="margin:12px 0;">
              Score: <span style="font-family:'Alfa Slab One';font-size:24px;color:var(--teal-dark);">${score} / ${total}</span> Correct
            </div>
            <div class="line">Rank earned: <b>${rank}</b></div>
            <div class="line sticky">Phish Hunt: COMPLETED ✔</div>
          </div>
          <div id="phishEndScoreboard" style="margin-top:28px; text-align:left;"></div>
          <div style="margin-top:24px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <button class="btn" id="phishAgainBtn">Play Again</button>
            <button class="btn secondary" id="phishHubBtn">Back to Hub</button>
          </div>
        </div>
        <div class="timestamp">CAM FINAL — PHISH DEBRIEF</div>
      </div>
    </div>
  `);

  wrap.querySelector('#phishAgainBtn').onclick = () => {
    state.phishLevel = 0; state.phishPhase = 'choose'; state.phishChosenSide = null; state.phishScore = 0;
    state.screen = 'phishRegistration'; render();
  };
  wrap.querySelector('#phishHubBtn').onclick = () => { state.screen = 'hub'; render(); };
  renderPhishScoreboard(wrap.querySelector('#phishEndScoreboard'));
  return wrap;
}

function mailChrome(ex) {
    let html = `<div class="mail">
      <div class="mail-head">
        <div class="logo-chip"><span class="mark" style="background:${ex.markColor}">${ex.mark}</span>${ex.brand}</div>
        <div class="mail-row"><span class="k">From</span><span class="v">${ex.from} &lt;${ex.fromEmail}&gt;</span></div>
        <div class="mail-row"><span class="k">To</span><span class="v">${ex.to}</span></div>
        <div class="mail-row" style="margin-top:6px; padding-top:6px; border-top:1px dashed #ccc;"><span class="k">Reply-To</span><span class="v">${ex.replyTo}</span></div>
        <div class="mail-subject">${ex.subject}</div>
      </div>
      <div class="mail-body">${ex.bodyHtml}`;
    if(ex.cta){
      html += `<div><a class="cta-btn ${ex.cta.style}" href="#">${ex.cta.text}</a></div>`;
    }
    if(ex.sig){
      html += `<div class="mail-sig">— ${ex.sig}</div>`;
    }
    html += `</div>`;
    if(ex.footer){ html += `<div class="mail-footer">${ex.footer}</div>`; }
    html += `</div>`;
    return html;
  }

  function loginChrome(ex) {
    let html = `
      <div class="browser-bar">
        <div class="browser-dots"><span></span><span></span><span></span></div>
        <div class="addr">
          <span class="lock">${ex.https ? '🔒' : '⚠️'}</span>
          <span class="url">https://${ex.url}</span>
        </div>
      </div>
      <div class="login-stage">
        <div class="login-card">
          <div class="logo-chip" style="justify-content:center;width:100%"><span class="mark" style="background:${ex.markColor}">${ex.mark}</span>${ex.brand}</div>
          <h3>Sign in to your account</h3>
          <div class="login-field">you@email.com</div>
          <div class="login-field">••••••••••</div>
          ${ex.extraField ? `<div class="login-field">${ex.extraField}</div>` : ''}
          <button class="login-submit" type="button">${ex.submitText}</button>
          <div class="login-foot">Forgot password?</div>
        </div>
      </div>`;
    return html;
  }

  function renderExhibitInner(level, side) {
    const ex = level[side];
    if(level.type === 'email') return mailChrome(ex);
    return loginChrome(ex);
  }

function renderPhish() {
  const levelData = PHISH_LEVELS[state.phishLevel];
  if (!levelData) {
    const wrap = el(`
      <div class="crt-frame">
        <div class="crt-inner">
          <div class="rec-tag"><span class="rec-dot"></span>REC</div>
          <div class="marquee">
            <h1>Phishing Master</h1>
            <div class="sub">ALL SIMULATIONS COMPLETED</div>
          </div>
          <div style="padding:40px 24px; text-align:center;">
            <div style="font-size:64px; margin-bottom:16px;">🎣</div>
            <p style="margin-bottom:24px; font-weight:bold;">Excellent work! You completed all the training cases.</p>
            <button class="btn" id="backToTitleBtn">Return to Main Menu</button>
          </div>
        </div>
      </div>
    `);
    wrap.querySelector('#backToTitleBtn').onclick = () => { state.screen="title"; render(); };
    return wrap;
  }

  const revealed = state.phishPhase === 'revealed';

  let html = `
    <div class="crt-frame">
      <div class="crt-inner">
        <div class="rec-tag"><span class="rec-dot"></span>REC</div>
        <div class="scene-header">
          <div>
            <h2>Spot the Phish: CASE 0${levelData.id}</h2>
            <div class="ftag">Difficulty: ${levelData.difficulty}</div>
          </div>
          <div class="progress-pill">${state.phishLevel + 1}/${PHISH_LEVELS.length} CASES</div>
        </div>
        
        <div style="padding: 20px; background: var(--wall);">
          <div style="margin-bottom:16px;">
            <h3 style="font-family:'Alfa Slab One', serif; font-size:18px; margin:0 0 6px;">${levelData.title}</h3>
            <p style="margin:0; font-family:'Space Mono', monospace; font-size:12px; color:var(--teal-dark);">${levelData.brief}</p>
          </div>
          <div style="font-family:'Space Mono', monospace; font-weight:bold; margin-bottom:10px; color:var(--burgundy);">
            ${revealed ? 'Review the evidence below.' : 'Which exhibit is the phishing attempt?'}
          </div>
          
          <div class="exhibits ${revealed ? 'revealed' : ''}">
            ${['A','B'].map(side => `
              <div class="exhibit ${revealed ? '' : 'pickable'}" data-side="${side}">
                <div class="exhibit-tag">EXHIBIT ${side}</div>
                <div class="stamp ${levelData.phishSide===side ? 'phish':'legit'}">${levelData.phishSide===side ? 'Phish' : 'Legitimate'}</div>
                ${renderExhibitInner(levelData, side)}
              </div>
            `).join('')}
          </div>
  `;

  if(!revealed) {
    html += `
          <div class="verdict-row">
            <button class="verdict-btn" id="pickA">Exhibit A is the phish →</button>
            <button class="verdict-btn" id="pickB">Exhibit B is the phish →</button>
          </div>
    `;
  } else {
    const correct = state.phishChosenSide === levelData.phishSide;
    html += `
          <div class="banner ${correct ? 'good':'bad'}">
            <div style="font-weight:bold;">${correct ? '✔' : '✘'}</div>
            <div><b>${correct ? 'Correct.' : 'Not quite.'}</b> Exhibit ${levelData.phishSide} was the phish${correct ? '' : ` — you picked ${state.phishChosenSide}`}.</div>
          </div>
          <div style="margin-top:20px; text-align:right;">
            <button class="btn good" id="nextCaseBtn">${state.phishLevel >= PHISH_LEVELS.length - 1 ? 'See Results →' : 'Next Case →'}</button>
          </div>
    `;
  }

  html += `
          <div style="margin-top:30px; text-align:left;">
            <button class="btn secondary small" id="quitPhishBtn">Quit to Menu</button>
          </div>
        </div>
        <div class="timestamp">SIMULATION ${state.phishLevel + 1}</div>
      </div>
    </div>
  `;

  const wrap = el(html);

  if(!revealed) {
    const pick = (side) => {
      state.phishChosenSide = side;
      state.phishPhase = 'revealed';
      if(side === levelData.phishSide) {
        state.phishScore += 1;
      }
      render();
    };
    wrap.querySelector('#pickA').onclick = () => pick('A');
    wrap.querySelector('#pickB').onclick = () => pick('B');
    wrap.querySelectorAll('.exhibit.pickable').forEach(exh => {
      exh.onclick = () => pick(exh.getAttribute('data-side'));
    });
  } else {
    wrap.querySelector('#nextCaseBtn').onclick = () => {
      const isLastCase = state.phishLevel >= PHISH_LEVELS.length - 1;
      if(isLastCase) {
        state.screen = 'phishEnding';
        render();
      } else {
        state.phishLevel++;
        state.phishPhase = 'choose';
        state.phishChosenSide = null;
        render();
      }
    };
  }
  
  wrap.querySelector('#quitPhishBtn').onclick = () => { state.screen="hub"; render(); };

  return wrap;
}

window.onFirebaseInit = () => {
  if (state.screen === 'title' || state.screen === 'ending') {
    render();
  }
};

render();
</script>
</body>
</html>
