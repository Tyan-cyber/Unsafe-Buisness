<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">CyberWare HQ — Training World Map</title>
  <desc id="description">A colorful illustrated map with Catch a Fish cybersecurity training by the sea, an unsafe business downtown, and password security training in the suburbs, connected by a winding road.</desc>
  <defs>
    <linearGradient id="grass" x2="0" y2="1">
      <stop offset="0" stop-color="#b9df9b"/>
      <stop offset="1" stop-color="#8fc77e"/>
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop offset="0" stop-color="#74c9dc"/>
      <stop offset="1" stop-color="#3c9fca"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dfac"/>
      <stop offset="1" stop-color="#eacb8d"/>
    </linearGradient>
    <pattern id="water-lines" width="92" height="46" patternUnits="userSpaceOnUse">
      <path d="M8 18c10-8 20-8 30 0s20 8 30 0 20-8 30 0" fill="none" stroke="#d8f6ef" stroke-width="4" stroke-linecap="round" opacity=".56"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="0" flood-color="#28435a" flood-opacity=".22"/>
    </filter>
    <style>
      .ink{stroke:#28354c;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;font-weight:900;letter-spacing:2px;fill:#28354c}
      .small{font-family:Arial,sans-serif;font-weight:700;letter-spacing:1px;fill:#4a5664}
    </style>
  </defs>

